<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Granja</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; font: 13px/1.35 "Inter", system-ui, -apple-system, Segoe UI, sans-serif; color: #f1eee8; }
  body { background: radial-gradient(ellipse at 50% 45%, #e9e5de 0%, #cfcac1 42%, #5d5952 100%); }
  #stage { position: fixed; inset: 0; }
  #stage canvas { display: block; width: 100%; height: 100%; cursor: grab; }
  .vignette { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 48%, transparent 64%, rgba(6,6,10,.22) 86%, rgba(4,4,8,.55) 100%); }
  .etiquetas { z-index: 1; }
  .fx { font-size: 26px; pointer-events: none; filter: drop-shadow(0 2px 6px rgba(0,0,0,.35)); }

  /* columnas de datos a los lados (fuera del orbe) */
  .col { position: fixed; top: 16px; bottom: 76px; width: clamp(150px, 24vw, 232px); z-index: 2; display: flex; flex-direction: column; gap: 8px; overflow-y: auto; scrollbar-width: none; transition: opacity .4s, transform .4s; }
  .col::-webkit-scrollbar { display: none; }
  .col.izq { left: 16px; --fuera: -30px; } .col.der { right: 16px; --fuera: 30px; }
  .col.off { opacity: 0; pointer-events: none; transform: translateX(var(--fuera)); }
  .card { background: rgba(16,17,21,.72); border: 1px solid rgba(255,255,255,.09); border-radius: 12px; padding: 9px 11px; }
  .card h4 { font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: #e7c46a; margin-bottom: 6px; font-weight: 600; }
  .pj .top { display: flex; align-items: baseline; gap: 6px; }
  .pj b { font-size: 13px; } .pj .cara { font-size: 15px; }
  .pj .act { color: rgba(241,238,232,.7); font-size: 11.5px; margin: 2px 0 6px; min-height: 15px; }
  .bars { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .bars i { display: flex; align-items: center; gap: 3px; font-style: normal; font-size: 9px; }
  .bars u { flex: 1; height: 4px; border-radius: 4px; background: rgba(255,255,255,.14); overflow: hidden; display: block; }
  .bars em { display: block; height: 100%; background: #7cc36a; transition: width .5s; }
  .bars em.mid { background: #e3b341; } .bars em.low { background: #e0574f; }
  .pj.muerto { opacity: .5; }
  .pj .extra { font-size: 10.5px; color: rgba(241,238,232,.62); margin-top: 6px; line-height: 1.35; }
  .pj .extra .deseo { color: #e7c46a; } .pj .extra .ofi { letter-spacing: .02em; }
  .gen { font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: #e7c46a; }
  .fecha { font: 600 13px ui-monospace, Consolas, monospace; margin-top: 3px; }
  .grid { display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; font-size: 12px; }
  .grid span { color: rgba(241,238,232,.7); } .grid b { text-align: right; font-weight: 600; } .grid b.warn, .extra .warn { color: #ff8a80; }
  .animales { display: flex; flex-wrap: wrap; gap: 4px 8px; font-size: 12px; }
  .animales span.muerto { opacity: .4; text-decoration: line-through; }
  .diario { list-style: none; display: grid; gap: 5px; font-size: 11.5px; color: rgba(241,238,232,.85); }
  .diario li { padding-left: 8px; border-left: 2px solid rgba(255,255,255,.15); }
  .diario li.bueno { border-color: #7cc36a; } .diario li.malo, .diario li.aviso { border-color: #e3b341; } .diario li.muerte { border-color: #e0574f; } .diario li.clima { border-color: #5aa0d8; } .diario li.logro { border-color: #e7c46a; }

  /* control de velocidad */
  .speeds { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); display: flex; gap: 2px; padding: 4px;
    background: rgba(18,18,22,.6); border: 1px solid rgba(255,255,255,.08); border-radius: 99px; transition: opacity .6s; z-index: 3; }
  .speeds.hide { opacity: 0; pointer-events: none; }
  .speeds button { white-space: nowrap; background: none; border: 0; color: inherit; font: inherit; font-size: 12px; font-weight: 600; padding: 7px 12px; border-radius: 99px; cursor: pointer; opacity: .75; }
  .speeds button.on { background: rgba(231,196,106,.95); color: #1b1a17; opacity: 1; }
  .caption { position: fixed; left: 50%; top: 22px; transform: translateX(-50%); font-size: 13px; letter-spacing: .12em; text-transform: uppercase;
    opacity: 0; transition: opacity 1.2s; pointer-events: none; text-shadow: 0 1px 10px rgba(0,0,0,.5); z-index: 2; }
  .caption.on { opacity: .9; }
  /* el jugador: dilemas, ficha de personaje e influencia */
  .diario li.decision { border-color: #b48ae0; }
  .dilema { position: fixed; left: 50%; top: 12px; transform: translateX(-50%); width: min(430px, calc(100vw - 24px)); z-index: 6;
    background: rgba(24,22,30,.94); border: 1px solid rgba(180,138,224,.45); border-radius: 14px; padding: 11px 13px 12px; box-shadow: 0 10px 30px rgba(0,0,0,.45);
    backdrop-filter: blur(8px); transition: opacity .35s, transform .35s; }
  body.con-dilema .caption { top: auto; bottom: 104px; }
  .dilema.off { opacity: 0; pointer-events: none; transform: translate(-50%, -12px); }
  .dilema h3 { font-size: 13.5px; margin: 0 0 3px; color: #e6d3ff; } .dilema p { margin: 0 0 8px; font-size: 12px; color: rgba(241,238,232,.82); line-height: 1.35; }
  .dilema .ops { display: grid; gap: 5px; } .dilema .mas { position: absolute; right: 12px; top: 10px; font-size: 11px; opacity: .6; }
  .dilema button, .fichapj button { text-align: left; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12); color: inherit; font: inherit; font-size: 12.5px; font-weight: 600;
    padding: 7px 10px; border-radius: 9px; cursor: pointer; } .dilema button:hover, .fichapj button:hover { background: rgba(180,138,224,.25); border-color: rgba(180,138,224,.6); }
  .dilema button small, .fichapj button small { display: block; font-weight: 400; font-size: 11px; opacity: .65; margin-top: 1px; }
  .dilema .reloj { height: 3px; background: rgba(255,255,255,.1); border-radius: 3px; margin-top: 9px; overflow: hidden; } .dilema .reloj i { display: block; height: 100%; background: #b48ae0; }
  .dilema .nota { font-size: 10.5px; opacity: .55; margin-top: 4px; }
  .fichapj { position: fixed; left: 50%; bottom: 70px; transform: translateX(-50%); width: min(340px, calc(100vw - 24px)); z-index: 6;
    background: rgba(24,22,30,.95); border: 1px solid rgba(255,255,255,.14); border-radius: 14px; padding: 11px 13px; box-shadow: 0 10px 30px rgba(0,0,0,.45); }
  .fichapj.off { display: none; } .fichapj .cerrar { position: absolute; right: 8px; top: 6px; background: none; border: 0; font-size: 18px; padding: 2px 6px; }
  .fichapj h3 { margin: 0 0 2px; font-size: 14px; } .fichapj .sub { font-size: 11.5px; opacity: .75; margin-bottom: 7px; } .fichapj .ops { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
  .fichapj button:disabled { opacity: .35; cursor: default; }
  .conf { height: 4px; background: rgba(255,255,255,.1); border-radius: 3px; margin: 3px 0 8px; } .conf i { display: block; height: 100%; background: #e7c46a; border-radius: 3px; }
  .influ { position: fixed; left: 50%; transform: translateX(-50%); bottom: 62px; z-index: 4; font-size: 12px; letter-spacing: .08em; padding: 4px 10px; border-radius: 99px;
    background: rgba(18,18,22,.55); border: 1px solid rgba(180,138,224,.25); color: #d9c2f5; pointer-events: none; }
  @media (max-width: 640px) {
    .dilema { top: auto; bottom: 58px; padding: 9px 10px 10px; } .dilema.off { transform: translate(-50%, 12px); }
    .dilema h3 { font-size: 12.5px; } .dilema p { font-size: 11px; margin-bottom: 6px; } .dilema .ops { grid-template-columns: 1fr 1fr; gap: 4px; }
    .dilema button { font-size: 11.5px; padding: 6px 8px; } .dilema button small { font-size: 10px; } .dilema .nota { display: none; }
    body.datos .dilema { bottom: auto; top: 8px; }
    body.con-dilema .caption { bottom: auto; top: 22px; }
  }
  @media (max-width: 640px) { .fichapj { bottom: auto; top: 12px; } .influ { bottom: auto; top: 8px; left: auto; right: 10px; transform: none; font-size: 11px; } }
  /* alertas y prioridades (estilo RimWorld) */
  .alertas { position: fixed; right: 12px; bottom: 70px; z-index: 5; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; max-width: 46vw; pointer-events: none; }
  .alertas div { font-size: 11.5px; padding: 4px 9px; border-radius: 8px; background: rgba(24,22,30,.86); border-left: 3px solid #e3b341; color: #f1eee8; }
  .alertas div.rojo { border-left-color: #e0574f; background: rgba(60,18,18,.88); }
  .btn-trabajo { position: fixed; left: 12px; bottom: 20px; z-index: 5; background: rgba(18,18,22,.7); color: #f1eee8; border: 1px solid rgba(255,255,255,.15); border-radius: 99px; padding: 7px 12px; font: inherit; font-size: 12px; font-weight: 600; cursor: pointer; }
  .prioridades { position: fixed; inset: 0; z-index: 8; background: rgba(0,0,0,.45); display: grid; place-items: center; }
  .prioridades.off { display: none; }
  .prioridades .caja { background: rgba(24,22,30,.97); border: 1px solid rgba(255,255,255,.14); border-radius: 14px; padding: 14px 16px; width: min(560px, calc(100vw - 24px)); }
  .prioridades h3 { margin: 0 0 4px; font-size: 14px; } .prioridades p { margin: 0 0 10px; font-size: 11.5px; opacity: .7; }
  .prioridades table { width: 100%; border-collapse: collapse; font-size: 12px; } .prioridades th { font-weight: 600; font-size: 11px; opacity: .75; padding: 4px; }
  .prioridades td { padding: 3px; text-align: center; } .prioridades td:first-child { text-align: left; font-weight: 600; }
  .prioridades td button { width: 34px; height: 28px; border-radius: 7px; border: 1px solid rgba(255,255,255,.15); background: rgba(255,255,255,.06); color: inherit; font: inherit; font-weight: 700; cursor: pointer; }
  .prioridades td button.p1 { background: #2e7d4f; } .prioridades td button.p2 { background: #4b7a3a; } .prioridades td button.p4 { background: #5a4a2a; } .prioridades td button.p0 { background: rgba(255,255,255,.02); opacity: .5; }
  .prioridades .cerrarP { margin-top: 10px; float: right; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.15); color: inherit; border-radius: 8px; padding: 6px 12px; font: inherit; cursor: pointer; }
  @media (max-width: 640px) { .alertas { top: 40px; bottom: auto; right: 8px; max-width: 60vw; } .alertas div { font-size: 10.5px; padding: 3px 7px; } .btn-trabajo { bottom: 64px; } body.datos .alertas, body.datos .btn-trabajo { display: none; } }
  #loader { position: fixed; inset: 0; z-index: 9; display: grid; place-items: center; background: #1b1a17; color: #a3a09a; font: 600 12px ui-monospace, Consolas, monospace; letter-spacing: .12em; transition: opacity .6s; }

  @media (max-width: 1000px) { .card { padding: 8px 9px; } .pj .act { font-size: 11px; } .grid { font-size: 11.5px; } }
  @media (max-width: 700px) { .col { top: 10px; bottom: 64px; gap: 6px; } .col.izq { left: 8px; } .col.der { right: 8px; } .card { padding: 6px 8px; border-radius: 10px; } .card h4 { font-size: 9.5px; margin-bottom: 4px; } .pj b { font-size: 12px; } .pj .act { font-size: 10.5px; margin-bottom: 4px; } .grid, .animales, .diario { font-size: 10.5px; } .fecha { font-size: 11px; } .bars { gap: 4px; } }
  /* celular: los datos van en un panel compacto abajo, con pestañas (y arrancan ocultos) */
  .tabs { display: none; }
  @media (max-width: 640px) {
    .col { top: auto; bottom: 58px; height: 36vh; width: auto; left: 8px !important; right: 8px !important; gap: 5px; }
    .col.izq { display: grid; grid-template-columns: 1fr 1fr; align-content: start; }
    .card { padding: 6px 8px; border-radius: 9px; background: rgba(16,17,21,.8); }
    .card h4 { font-size: 9px; margin-bottom: 3px; }
    .pj b { font-size: 11.5px; } .pj .cara { font-size: 13px; } .pj .act { font-size: 10px; margin: 1px 0 4px; }
    .pj .extra { font-size: 9.5px; margin-top: 4px; }
    .bars { gap: 3px; } .bars i { font-size: 8px; }
    .grid, .animales, .diario { font-size: 10.5px; } .fecha { font-size: 11px; } .gen { font-size: 9.5px; }
    body.tab-granja .col.izq, body.tab-diario .col.izq, body.tab-pj .col.der { display: none; }
    body.tab-granja .col.der .card[data-tab="diario"], body.tab-diario .col.der .card:not([data-tab="diario"]) { display: none; }
    .tabs { display: flex; position: fixed; left: 8px; right: 8px; bottom: calc(58px + 36vh + 5px); gap: 4px; z-index: 3; transition: opacity .4s; }
    .tabs.off { opacity: 0; pointer-events: none; }
    .tabs button { flex: 1; background: rgba(16,17,21,.75); border: 1px solid rgba(255,255,255,.1); color: inherit; font: 600 11px/1 inherit; font-family: inherit; padding: 7px 4px; border-radius: 99px; cursor: pointer; opacity: .75; }
    .tabs button.on { background: rgba(231,196,106,.95); color: #1b1a17; opacity: 1; }
    .speeds { bottom: 12px; } .speeds button { font-size: 11px; padding: 6px 9px; }
  }
</style>
</head>
<body>
<div id="loader">CARGANDO…</div>
<div id="stage"></div>
<div class="vignette"></div>
<aside class="col izq" id="izq"></aside>
<aside class="col der" id="der"></aside>
<div class="tabs" id="tabs"></div>
<div class="speeds" id="speeds"></div>
<div class="caption" id="caption"></div>
<div class="dilema off" id="dilema"></div>
<div class="fichapj off" id="fichapj"></div>
<div class="influ" id="influ" title="Influencia: se recarga cada día"></div>
<div class="alertas" id="alertas"></div>
<button class="btn-trabajo" id="btnTrabajo">⚙ Trabajo</button>
<div class="prioridades off" id="prioridades"><div class="caja"><h3>Prioridades de trabajo</h3><p>1 = lo hace primero · 4 = lo deja para el final · – = no lo hace (salvo emergencias). Toca una casilla para cambiarla.</p><table id="tablaP"></table><button class="cerrarP" id="cerrarP">Listo</button></div></div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<script type="module">
import * as Sim from './js/sim.js';
import { crearEscena } from './js/escena.js';

// velocidades: minutos de juego por segundo real (×120 → un día dura 12 minutos)
const VELOCIDADES = [[1, '×60'], [2, '×120'], [10, '×600'], [60, '×3600']];
const VEL_DEFECTO = 1;
const MAX_AUSENCIA = 30 * Sim.MIN_DIA;

const ahoraEnMinutos = () => { const d = new Date(); return d.getHours() * 60 + d.getMinutes(); };
const nueva = (generacion = 1) => Sim.nuevaPartida({ inicio: ahoraEnMinutos(), generacion });

let vel = VEL_DEFECTO;
try { const v = localStorage.getItem('granja3d-vel2'); if (v != null) vel = Math.max(0, Math.min(VELOCIDADES.length - 1, +v)); } catch { /* sin almacenamiento */ }

let estado = Sim.cargar();
// la granja sigue viviendo con la página cerrada (o la pestaña oculta), al mismo ritmo;
// ese tiempo se simula por partes en los cuadros siguientes para no congelar la pantalla
let pendiente = 0;
const ponerAlDia = (min) => { if (min > 0 && Number.isFinite(min)) pendiente = Math.min(MAX_AUSENCIA, pendiente + min); };
if (estado && estado.guardadoReal && !estado.fin) ponerAlDia(((Date.now() - estado.guardadoReal) / 1000) * VELOCIDADES[vel][0]);
if (!estado) estado = nueva(1 + Math.max(0, ...Sim.historial().map((h) => h.generacion)));
let ocultoDesde = null;
document.addEventListener('visibilitychange', () => {
  if (document.hidden) ocultoDesde = Date.now();
  else if (ocultoDesde) { ponerAlDia(((Date.now() - ocultoDesde) / 1000) * VELOCIDADES[vel][0]); ocultoDesde = null; }
});

let parcelaSel = null;   // ficha de la parcela que se toque
let fichaId = null;
const escena = crearEscena(document.getElementById('stage'), { onParcela: (i) => { parcelaSel = parcelaSel === i ? null : i; escena.seleccionar(parcelaSel); pintarDatos(); }, onAgente: (id) => { fichaId = fichaId === id ? null : id; pintarJugador(true); } });
// acceso de depuración desde la consola (no afecta la simulación)
window.granja = { get estado() { return estado; }, escena };

// ---------------------------------------------------------------- columnas de datos
const izq = document.getElementById('izq'), der = document.getElementById('der');
const angosto = () => innerWidth <= 640;
let datos = !angosto();   // en el celular arrancan ocultos: el orbe ocupa la pantalla
function encuadre() {
  if (!datos) return escena.encuadrar(0, 0, 0);
  if (angosto()) return escena.encuadrar(0, 0, innerHeight * 0.36 + 58 + 36);   // en el celular los datos van en un panel abajo
  const ancho = izq.getBoundingClientRect().width || 232;
  escena.encuadrar(ancho + 44, ancho + 44, 0);
}
const NECS = [['comida', '🍽'], ['agua', '💧'], ['energia', '⚡'], ['salud', '❤']];
const EMO = { tomas: '👨', lucia: '👩', nube: '🐕', esmoquin: '🐈‍⬛' };
const EMO_G = { vaca: '🐄', oveja: '🐑', gallina: '🐔', gallo: '🐓' };
const ICO = { lechuga: '🥬', papa: '🥔', frijol: '🫘', maiz: '🌽' };
const OFI = { huerto: '🌱', agua: '💧', cuidado: '🩹', casa: '🍳', granja: '🐄', carpinteria: '🔨' };
const tarjetas = {};
function crearTarjetas() {
  izq.replaceChildren();
  for (const a of estado.agentes) {
    const c = document.createElement('div'); c.className = 'card pj';
    c.innerHTML = `<div class="top"><span class="cara"></span><b></b></div><div class="act"></div><div class="bars">${NECS.map(([k, ic]) => `<i title="${k}">${ic}<u><em data-k="${k}"></em></u></i>`).join('')}</div><div class="extra"></div>`;
    izq.append(c);
    tarjetas[a.id] = c;
  }
}
crearTarjetas();
function pintarDatos() {
  if (!datos) return;
  const s = estado, R = s.rec;
  for (const a of s.agentes) {
    const c = tarjetas[a.id]; if (!c) continue;
    c.classList.toggle('muerto', !a.vivo);
    c.querySelector('.cara').textContent = a.tipo === 'humano' && a.vivo ? Sim.caraAnimo(a.animo) : EMO[a.id] || '•';
    c.querySelector('b').textContent = (a.vivo ? '' : '† ') + a.nombre + (a.enfermo > 0 ? ' 🤒' : '');
    c.querySelector('.act').textContent = a.vivo ? (a.dentro ? `En casa · ${a.accion.toLowerCase()}` : a.accion) : `Murió ${a.causa || ''}`;
    c.querySelector('.bars').style.display = a.vivo ? '' : 'none';
    // rasgos, deseo, oficios y vínculo
    const rasgos = a.rasgos.map((r) => Sim.RASGOS[r]?.nombre).filter(Boolean).join(' · ');
    let extra = `<div title="${a.rasgos.map((r) => Sim.RASGOS[r]?.desc).join(' · ')}">${rasgos}</div>`;
    if (a.vivo && a.tipo === 'humano') {
      if (a.deseo) extra += `<div class="deseo">✨ ${a.deseo.texto}</div>`;
      const ofi = Object.entries(a.xp || {}).map(([k, v]) => [k, Sim.nivel(v)]).filter(([, n]) => n > 0).sort((x, y) => y[1] - x[1]).slice(0, 4);
      if (ofi.length) extra += `<div class="ofi" title="Oficios (nivel)">${ofi.map(([k, n]) => `${OFI[k] || ''}${n}`).join('  ')}</div>`;
      const PL = a.placer || {}, est = [];
      if (a.resacaHasta > s.t) est.push('🥴 resaca'); else if (a.borrachoHasta > s.t) est.push('🍷 entonado');
      if (a.colocadoHasta > s.t) est.push('🌿 relajado');
      for (const [k, ic] of [['vino', '🍷'], ['hierba', '🌿']]) { const d = PL[k]?.dep || 0; if (PL[k]?.pausa > Sim.dia(s)) est.push(`${ic} lo está dejando`); else if (d > 0.3) est.push(`<span class="warn">${ic} dependencia ${Math.round(d * 100)} %</span>`); }
      if ((a.deseoSex || 0) > 70) est.push('💗 con ganas');
      est.push(`💪 forma ${Math.round(a.forma ?? 40)}`);
      if (est.length) extra += `<div title="Vino: ${PL.vino?.usos || 0} veces · Hierba: ${PL.hierba?.usos || 0} veces">${est.join(' · ')}</div>`;
    } else if (a.vivo && a.vinculo) {
      const fav = Object.entries(a.vinculo).sort((x, y) => y[1] - x[1])[0];
      const h = s.agentes.find((x) => x.id === fav?.[0]);
      if (h) extra += `<div>♥ ${h.nombre} (${Math.round(fav[1])})</div>`;
    }
    const ex = c.querySelector('.extra'); if (ex.innerHTML !== extra) ex.innerHTML = extra;
    c.querySelectorAll('em').forEach((em) => { const v = Math.max(0, Math.min(100, a.n[em.dataset.k])); em.style.width = v + '%'; em.className = v < 25 ? 'low' : v < 50 ? 'mid' : ''; });
  }
  const hum = s.agentes.filter((a) => a.vivo && a.tipo === 'humano').length;
  const consumo = hum * 1.4 + s.agentes.filter((a) => a.vivo && a.tipo !== 'humano').length * 0.5;
  const dias = consumo ? Math.floor(Sim.comidaTotal(s) / consumo) : 0;
  const vividos = Sim.diasVividos(s), años = Math.floor(vividos / Sim.DIAS_ANIO);

// ---------------------------------------------------------------- el jugador: dilemas, ficha e influencia
const elDil = document.getElementById('dilema'), elFicha = document.getElementById('fichapj'), elInflu = document.getElementById('influ');
let htmlDil = '', htmlFicha = '';
const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function pintarJugador(forzar = false) {
  const s = estado, J = s.jugador; if (!J) return;
  elInflu.textContent = `✦ ${'●'.repeat(Math.floor(J.influencia))}${'○'.repeat(Math.max(0, J.max - Math.floor(J.influencia)))}`;
  // dilema pendiente (el más antiguo)
  const d = (s.dilemas || [])[0];
  document.body.classList.toggle('con-dilema', !!d);
  if (!d) { elDil.classList.add('off'); htmlDil = ''; }
  else {
    const h = `<div class="mas">${s.dilemas.length > 1 ? `+${s.dilemas.length - 1} más` : ''}</div><h3>${esc(d.titulo)}</h3><p>${esc(d.texto)}</p><div class="ops">${d.opciones.map((o) => `<button data-d="${d.id}" data-k="${esc(o.k)}">${esc(o.txt)}${o.pista ? `<small>${esc(o.pista)}</small>` : ''}</button>`).join('')}</div><div class="reloj"><i></i></div><div class="nota">Si no decides, ellos decidirán solos.</div>`;
    if (h !== htmlDil || forzar) { elDil.innerHTML = h; htmlDil = h; }
    elDil.classList.remove('off');
    elDil.querySelector('.reloj i').style.width = Math.max(0, Math.min(100, (d.vence - s.t) / (d.vence - d.creado) * 100)) + '%';
  }
  // ficha del personaje tocado
  const a = fichaId && s.agentes.find((x) => x.id === fichaId);
  if (!a || !a.vivo) { elFicha.classList.add('off'); htmlFicha = ''; fichaId = null; return; }
  const conf = J.confianza[a.id] ?? 50;
  // la cabecera cambia seguido; los botones solo se rehacen si cambia la influencia (para no perder clics)
  if (!elFicha.querySelector('.cab') || forzar && elFicha.dataset.id !== a.id) { elFicha.innerHTML = '<button class="cerrar" data-cerrar="1">×</button><div class="cab"></div><div class="ops"></div>'; elFicha.dataset.id = a.id; htmlFicha = ''; }
  const cab = `<h3>${Sim.caraAnimo(a.animo)} ${esc(a.nombre)}</h3>
    <div class="sub">${esc(a.dentro ? 'En casa · ' + a.accion.toLowerCase() : a.accion)}${a.deseo ? ` · ✨ ${esc(a.deseo.texto)}` : ''}</div>
    <div class="sub" style="margin:0">Confianza en ti: ${Math.round(conf)} / 100</div><div class="conf"><i style="width:${conf}%"></i></div>`;
  const elCab = elFicha.querySelector('.cab'); if (elCab.innerHTML !== cab) elCab.innerHTML = cab;
  const ops = Object.entries(Sim.ACCIONES).map(([k, A]) => `<button data-acc="${k}" ${J.influencia < A.costo ? 'disabled' : ''}>${esc(A.txt)} <span style="opacity:.6">${'●'.repeat(A.costo)}</span><small>${esc(A.pista)}</small></button>`).join('');
  if (ops !== htmlFicha) { elFicha.querySelector('.ops').innerHTML = ops; htmlFicha = ops; }
  elFicha.classList.remove('off');
}
elDil.addEventListener('click', (e) => {
  const b = e.target.closest('button[data-d]'); if (!b) return;
  if (Sim.decidir(estado, +b.dataset.d, b.dataset.k)) { guardar(); pintarJugador(true); pintarDatos(); }
});
elFicha.addEventListener('click', (e) => {
  if (e.target.closest('[data-cerrar]')) { fichaId = null; pintarJugador(true); return; }
  const b = e.target.closest('button[data-acc]'); if (!b || !fichaId) return;
  const r = Sim.actuar(estado, fichaId, b.dataset.acc);
  const a = estado.agentes.find((x) => x.id === fichaId);
  if (r.msg) aviso(r.msg); else if (r.ok) aviso(r.acepto ? `${a.nombre} te hizo caso` : `${a.nombre} no te hizo caso`);
  guardar(); pintarJugador(true);
});

let last = performance.now(), t = 0, finEn = null, fallosEscena = 0;
function loop(now) {
  requestAnimationFrame(loop);   // primero: pase lo que pase en este cuadro, el siguiente llega
  const dt = Math.min((now - last) / 1000, 0.1); last = now; t += dt;
  try {
    if (!estado.fin) {
      // ponerse al día: como máximo ~12 ms de simulación extra por cuadro
      if (pendiente > 0) {
        const t0 = performance.now();
        while (pendiente > 0 && !estado.fin && performance.now() - t0 < 12) { const m = Math.min(pendiente, 30); Sim.avanzar(estado, m); pendiente -= m; }
        caption.textContent = pendiente > 1 ? `Poniéndose al día… ${Math.ceil(pendiente / Sim.MIN_DIA)} d` : ''; caption.classList.toggle('on', pendiente > 60);
      }
      Sim.avanzar(estado, dt * VELOCIDADES[vel][0]);
    } else {
      pendiente = 0;
      if (finEn == null) { Sim.registrarGeneracion(estado); finEn = t + 20; guardar(); }
      if (t > finEn) { estado = nueva(estado.generacion + 1); finEn = null; guardar(); crearTarjetas(); aviso(`Generación ${estado.generacion}`); }
    }
  } catch (e) { console.warn('[granja] error en el bucle:', e); }
  escena.ocupado = pendiente > 0;
  try { escena.update(estado, t, dt); fallosEscena = 0; } catch (e) { if (fallosEscena++ === 0) console.warn('[granja] error al dibujar:', e); }
  if (escena.cargada) { const l = document.getElementById('loader'); if (l) { l.style.opacity = 0; setTimeout(() => l.remove(), 600); } }
}
requestAnimationFrame(loop);
</script>
