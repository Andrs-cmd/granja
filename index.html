<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Granja</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; font: 13px/1.35 "Inter", system-ui, -apple-system, Segoe UI, sans-serif; color: #f1eee8; }
  body { background: radial-gradient(ellipse at 50% 45%, #e9e5de 0%, #cfcac1 42%, #5d5952 100%); }
  #stage { position: fixed; inset: 0; }
  #stage canvas { display: block; width: 100%; height: 100%; cursor: grab; }
  .vignette { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 48%, transparent 50%, rgba(6,6,10,.5) 80%, rgba(4,4,8,.85) 100%); }
  .etiquetas { z-index: 1; }
  .fx { font-size: 26px; pointer-events: none; filter: drop-shadow(0 2px 6px rgba(0,0,0,.35)); }

  /* columnas de datos a los lados (fuera del orbe) */
  .col { position: fixed; top: 16px; bottom: 76px; width: clamp(150px, 24vw, 232px); z-index: 2; display: flex; flex-direction: column; gap: 8px; overflow-y: auto; scrollbar-width: none; transition: opacity .4s, transform .4s; }
  .col::-webkit-scrollbar { display: none; }
  .col.izq { left: 16px; --fuera: -30px; } .col.der { right: 16px; --fuera: 30px; }
  .col.off { opacity: 0; pointer-events: none; transform: translateX(var(--fuera)); }
  .card { background: rgba(16,17,21,.72); border: 1px solid rgba(255,255,255,.09); border-radius: 12px; padding: 9px 11px; }
  .card h4 { font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: #e7c46a; margin-bottom: 6px; font-weight: 600; }
  .pj .top { display: flex; align-items: baseline; gap: 6px; }
  .pj b { font-size: 13px; } .pj .cara { font-size: 15px; }
  .pj .act { color: rgba(241,238,232,.7); font-size: 11.5px; margin: 2px 0 6px; min-height: 15px; }
  .bars { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .bars i { display: flex; align-items: center; gap: 3px; font-style: normal; font-size: 9px; }
  .bars u { flex: 1; height: 4px; border-radius: 4px; background: rgba(255,255,255,.14); overflow: hidden; display: block; }
  .bars em { display: block; height: 100%; background: #7cc36a; transition: width .5s; }
  .bars em.mid { background: #e3b341; } .bars em.low { background: #e0574f; }
  .pj.muerto { opacity: .5; }
  .pj .extra { font-size: 10.5px; color: rgba(241,238,232,.62); margin-top: 6px; line-height: 1.35; }
  .pj .extra .deseo { color: #e7c46a; } .pj .extra .ofi { letter-spacing: .02em; }
  .gen { font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: #e7c46a; }
  .fecha { font: 600 13px ui-monospace, Consolas, monospace; margin-top: 3px; }
  .grid { display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; font-size: 12px; }
  .grid span { color: rgba(241,238,232,.7); } .grid b { text-align: right; font-weight: 600; } .grid b.warn { color: #ff8a80; }
  .animales { display: flex; flex-wrap: wrap; gap: 4px 8px; font-size: 12px; }
  .animales span.muerto { opacity: .4; text-decoration: line-through; }
  .diario { list-style: none; display: grid; gap: 5px; font-size: 11.5px; color: rgba(241,238,232,.85); }
  .diario li { padding-left: 8px; border-left: 2px solid rgba(255,255,255,.15); }
  .diario li.bueno { border-color: #7cc36a; } .diario li.malo, .diario li.aviso { border-color: #e3b341; } .diario li.muerte { border-color: #e0574f; } .diario li.clima { border-color: #5aa0d8; } .diario li.logro { border-color: #e7c46a; }

  /* control de velocidad */
  .speeds { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); display: flex; gap: 2px; padding: 4px;
    background: rgba(18,18,22,.6); border: 1px solid rgba(255,255,255,.08); border-radius: 99px; transition: opacity .6s; z-index: 3; }
  .speeds.hide { opacity: 0; pointer-events: none; }
  .speeds button { white-space: nowrap; background: none; border: 0; color: inherit; font: inherit; font-size: 12px; font-weight: 600; padding: 7px 12px; border-radius: 99px; cursor: pointer; opacity: .75; }
  .speeds button.on { background: rgba(231,196,106,.95); color: #1b1a17; opacity: 1; }
  .caption { position: fixed; left: 50%; top: 22px; transform: translateX(-50%); font-size: 13px; letter-spacing: .12em; text-transform: uppercase;
    opacity: 0; transition: opacity 1.2s; pointer-events: none; text-shadow: 0 1px 10px rgba(0,0,0,.5); z-index: 2; }
  .caption.on { opacity: .9; }
  #loader { position: fixed; inset: 0; z-index: 9; display: grid; place-items: center; background: #1b1a17; color: #a3a09a; font: 600 12px ui-monospace, Consolas, monospace; letter-spacing: .12em; transition: opacity .6s; }

  @media (max-width: 1000px) { .card { padding: 8px 9px; } .pj .act { font-size: 11px; } .grid { font-size: 11.5px; } }
  @media (max-width: 700px) { .col { top: 10px; bottom: 64px; gap: 6px; } .col.izq { left: 8px; } .col.der { right: 8px; } .card { padding: 6px 8px; border-radius: 10px; } .card h4 { font-size: 9.5px; margin-bottom: 4px; } .pj b { font-size: 12px; } .pj .act { font-size: 10.5px; margin-bottom: 4px; } .grid, .animales, .diario { font-size: 10.5px; } .fecha { font-size: 11px; } .bars { gap: 4px; } }
  /* celular: los datos van en un panel compacto abajo, con pestañas (y arrancan ocultos) */
  .tabs { display: none; }
  @media (max-width: 640px) {
    .col { top: auto; bottom: 58px; height: 36vh; width: auto; left: 8px !important; right: 8px !important; gap: 5px; }
    .col.izq { display: grid; grid-template-columns: 1fr 1fr; align-content: start; }
    .card { padding: 6px 8px; border-radius: 9px; background: rgba(16,17,21,.8); }
    .card h4 { font-size: 9px; margin-bottom: 3px; }
    .pj b { font-size: 11.5px; } .pj .cara { font-size: 13px; } .pj .act { font-size: 10px; margin: 1px 0 4px; }
    .pj .extra { font-size: 9.5px; margin-top: 4px; }
    .bars { gap: 3px; } .bars i { font-size: 8px; }
    .grid, .animales, .diario { font-size: 10.5px; } .fecha { font-size: 11px; } .gen { font-size: 9.5px; }
    body.tab-granja .col.izq, body.tab-diario .col.izq, body.tab-pj .col.der { display: none; }
    body.tab-granja .col.der .card[data-tab="diario"], body.tab-diario .col.der .card:not([data-tab="diario"]) { display: none; }
    .tabs { display: flex; position: fixed; left: 8px; right: 8px; bottom: calc(58px + 36vh + 5px); gap: 4px; z-index: 3; transition: opacity .4s; }
    .tabs.off { opacity: 0; pointer-events: none; }
    .tabs button { flex: 1; background: rgba(16,17,21,.75); border: 1px solid rgba(255,255,255,.1); color: inherit; font: 600 11px/1 inherit; font-family: inherit; padding: 7px 4px; border-radius: 99px; cursor: pointer; opacity: .75; }
    .tabs button.on { background: rgba(231,196,106,.95); color: #1b1a17; opacity: 1; }
    .speeds { bottom: 12px; } .speeds button { font-size: 11px; padding: 6px 9px; }
  }
</style>
</head>
<body>
<div id="loader">CARGANDO…</div>
<div id="stage"></div>
<div class="vignette"></div>
<aside class="col izq" id="izq"></aside>
<aside class="col der" id="der"></aside>
<div class="tabs" id="tabs"></div>
<div class="speeds" id="speeds"></div>
<div class="caption" id="caption"></div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<script type="module">
import * as Sim from './js/sim.js';
import { crearEscena } from './js/escena.js';

// velocidades: minutos de juego por segundo real (×120 → un día dura 12 minutos)
const VELOCIDADES = [[1, '×60'], [2, '×120'], [10, '×600'], [60, '×3600']];
const VEL_DEFECTO = 1;
const MAX_AUSENCIA = 30 * Sim.MIN_DIA;

const ahoraEnMinutos = () => { const d = new Date(); return d.getHours() * 60 + d.getMinutes(); };
const nueva = (generacion = 1) => Sim.nuevaPartida({ inicio: ahoraEnMinutos(), generacion });

let vel = VEL_DEFECTO;
try { const v = localStorage.getItem('granja3d-vel2'); if (v != null) vel = Math.max(0, Math.min(VELOCIDADES.length - 1, +v)); } catch { /* sin almacenamiento */ }

let estado = Sim.cargar();
if (estado && estado.guardadoReal && !estado.fin) {
  // la granja siguió viviendo con la página cerrada, al mismo ritmo
  const ausente = Math.min(((Date.now() - estado.guardadoReal) / 1000) * VELOCIDADES[vel][0], MAX_AUSENCIA);
  if (ausente > 0) Sim.avanzar(estado, ausente);
}
if (!estado) estado = nueva(1 + Math.max(0, ...Sim.historial().map((h) => h.generacion)));

let parcelaSel = null;   // ficha de la parcela que se toque
const escena = crearEscena(document.getElementById('stage'), { onParcela: (i) => { parcelaSel = parcelaSel === i ? null : i; escena.seleccionar(parcelaSel); pintarDatos(); } });
// acceso de depuración desde la consola (no afecta la simulación)
window.granja = { get estado() { return estado; } };

// ---------------------------------------------------------------- columnas de datos
const izq = document.getElementById('izq'), der = document.getElementById('der');
const angosto = () => innerWidth <= 640;
let datos = !angosto();   // en el celular arrancan ocultos: el orbe ocupa la pantalla
function encuadre() {
  if (!datos) return escena.encuadrar(0, 0, 0);
  if (angosto()) return escena.encuadrar(0, 0, innerHeight * 0.36 + 58 + 36);   // en el celular los datos van en un panel abajo
  const ancho = izq.getBoundingClientRect().width || 232;
  escena.encuadrar(ancho + 44, ancho + 44, 0);
}
const NECS = [['comida', '🍽'], ['agua', '💧'], ['energia', '⚡'], ['salud', '❤']];
const EMO = { tomas: '👨', lucia: '👩', nube: '🐕', esmoquin: '🐈‍⬛' };
const EMO_G = { vaca: '🐄', oveja: '🐑', gallina: '🐔', gallo: '🐓' };
const ICO = { lechuga: '🥬', papa: '🥔', frijol: '🫘', maiz: '🌽' };
const OFI = { huerto: '🌱', agua: '💧', cuidado: '🩹', casa: '🍳', granja: '🐄', carpinteria: '🔨' };
const tarjetas = {};
function crearTarjetas() {
  izq.replaceChildren();
  for (const a of estado.agentes) {
    const c = document.createElement('div'); c.className = 'card pj';
    c.innerHTML = `<div class="top"><span class="cara"></span><b></b></div><div class="act"></div><div class="bars">${NECS.map(([k, ic]) => `<i title="${k}">${ic}<u><em data-k="${k}"></em></u></i>`).join('')}</div><div class="extra"></div>`;
    izq.append(c);
    tarjetas[a.id] = c;
  }
}
crearTarjetas();
function pintarDatos() {
  if (!datos) return;
  const s = estado, R = s.rec;
  for (const a of s.agentes) {
    const c = tarjetas[a.id]; if (!c) continue;
    c.classList.toggle('muerto', !a.vivo);
    c.querySelector('.cara').textContent = a.tipo === 'humano' && a.vivo ? Sim.caraAnimo(a.animo) : EMO[a.id] || '•';
    c.querySelector('b').textContent = (a.vivo ? '' : '† ') + a.nombre + (a.enfermo > 0 ? ' 🤒' : '');
    c.querySelector('.act').textContent = a.vivo ? (a.dentro ? `En casa · ${a.accion.toLowerCase()}` : a.accion) : `Murió ${a.causa || ''}`;
    c.querySelector('.bars').style.display = a.vivo ? '' : 'none';
    // rasgos, deseo, oficios y vínculo
    const rasgos = a.rasgos.map((r) => Sim.RASGOS[r]?.nombre).filter(Boolean).join(' · ');
    let extra = `<div title="${a.rasgos.map((r) => Sim.RASGOS[r]?.desc).join(' · ')}">${rasgos}</div>`;
    if (a.vivo && a.tipo === 'humano') {
      if (a.deseo) extra += `<div class="deseo">✨ ${a.deseo.texto}</div>`;
      const ofi = Object.entries(a.xp || {}).map(([k, v]) => [k, Sim.nivel(v)]).filter(([, n]) => n > 0).sort((x, y) => y[1] - x[1]).slice(0, 4);
      if (ofi.length) extra += `<div class="ofi" title="Oficios (nivel)">${ofi.map(([k, n]) => `${OFI[k] || ''}${n}`).join('  ')}</div>`;
    } else if (a.vivo && a.vinculo) {
      const fav = Object.entries(a.vinculo).sort((x, y) => y[1] - x[1])[0];
      const h = s.agentes.find((x) => x.id === fav?.[0]);
      if (h) extra += `<div>♥ ${h.nombre} (${Math.round(fav[1])})</div>`;
    }
    const ex = c.querySelector('.extra'); if (ex.innerHTML !== extra) ex.innerHTML = extra;
    c.querySelectorAll('em').forEach((em) => { const v = Math.max(0, Math.min(100, a.n[em.dataset.k])); em.style.width = v + '%'; em.className = v < 25 ? 'low' : v < 50 ? 'mid' : ''; });
  }
  const hum = s.agentes.filter((a) => a.vivo && a.tipo === 'humano').length;
  const consumo = hum * 1.4 + s.agentes.filter((a) => a.vivo && a.tipo !== 'humano').length * 0.5;
  const dias = consumo ? Math.floor(Sim.comidaTotal(s) / consumo) : 0;
  const vividos = Sim.diasVividos(s), años = Math.floor(vividos / Sim.DIAS_ANIO);
  const clima = s.sequia > 0 ? '☀️ sequía' : s.clima.lluvia ? '🌧️ lluvia' : s.clima.arcoiris > s.t ? '🌈 arcoíris' : '';
  const sem = Object.entries(R.semillas).map(([k, v]) => `${ICO[k]}${v}`).join(' ');
  const grupos = [
    ['🐄', 'vaca|vacas', (g) => g.tipo === 'vaca' && g.sexo === 'h' && g.crec >= 1], ['🐂', 'toro|toros', (g) => g.tipo === 'vaca' && g.sexo === 'm' && g.crec >= 1],
    ['🐑', 'oveja|ovejas', (g) => g.tipo === 'oveja' && g.sexo === 'h' && g.crec >= 1], ['🐏', 'carnero|carneros', (g) => g.tipo === 'oveja' && g.sexo === 'm' && g.crec >= 1],
    ['🐔', 'gallina|gallinas', (g) => g.tipo === 'gallina'], ['🐓', 'gallo|gallos', (g) => g.tipo === 'gallo'],
    ['🍼', 'cría|crías', (g) => g.crec < 1 && g.tipo !== 'pollito'], ['🐣', 'pollito|pollitos', (g) => g.tipo === 'pollito'],
  ];
  const vivosG = s.ganado.filter((g) => g.vivo);
  const fichaAnimal = (g) => `${g.nombre} · gen. ${g.generacion || 0}${g.rasgo ? ' · ' + g.rasgo : ''} · estrés ${Math.round(g.estres || 0)}`;
  const animales = grupos.map(([ic, txt, f]) => { const l = vivosG.filter(f); return l.length ? `<span title="${l.map(fichaAnimal).join('&#10;')}">${ic} ${l.length} ${txt.split('|')[l.length === 1 ? 0 : 1]}</span>` : ''; }).join('')
    + (s.ganado.some((g) => g.empolla) ? '<span>🥚 empollando</span>' : '');
  const huerto = s.parcelas.map((p) => p.cultivo ? `${ICO[p.cultivo]}${p.estado === 'lista' ? '✓' : p.estado === 'muerta' ? '✗' : Math.floor(Math.min(1, p.crec / Sim.CULTIVOS[p.cultivo].dias) * 100) + '%'}` : '·').join('  ');
  const P = s.parcelas, prom = (k) => P.reduce((t, p) => t + (p[k] ?? 0), 0) / P.length;
  const plagas = P.filter((p) => (p.plaga || 0) > 0.05 && p.cultivo).length;
  let ficha = '';
  if (parcelaSel != null && P[parcelaSel]) {
    const p = P[parcelaSel], C = p.cultivo ? Sim.CULTIVOS[p.cultivo] : null;
    const est = !C ? 'en descanso' : p.estado === 'lista' ? 'lista para cosechar' : p.estado === 'muerta' ? 'perdida' : `${Math.floor(Math.min(1, p.crec / C.dias) * 100)} %`;
    ficha = `<div class="card"><h4>Parcela ${parcelaSel + 1}</h4><div class="grid">
      <span>${C ? ICO[p.cultivo] + ' ' + C.nombre : '🟫 Vacía'}</span><b>${est}</b>
      <span>🧪 N · P · K</span><b class="${Math.min(p.N, p.P, p.K) < 30 ? 'warn' : ''}">${Math.round(p.N)} · ${Math.round(p.P)} · ${Math.round(p.K)}</b>
      <span>⚗️ pH</span><b class="${Math.abs(p.ph - 6.5) > 0.8 ? 'warn' : ''}">${p.ph.toFixed(1)}</b>
      <span>💧 Humedad</span><b>${Math.round(p.agua)} %${(p.encharcado || 0) > 90 ? ' · encharcada' : ''}</b>
      ${C ? `<span>🌿 Salud</span><b class="${p.salud < 50 ? 'warn' : ''}">${Math.round(p.salud)} %</b>` : ''}
      ${(p.plaga || 0) > 0.05 ? `<span>${p.plagaTipo === 'hongo' ? '🍄 Hongo' : '🐛 Insectos'}</span><b class="warn">${Math.round(p.plaga * 100)} %</b>` : ''}
      <span>↺ Antes</span><b>${p.ultimo ? Sim.CULTIVOS[p.ultimo].nombre : '—'}</b></div></div>`;
  }
  der.innerHTML = `
    <div class="card"><div class="gen">Generación ${s.generacion} · ${años ? `${años} año${años > 1 ? 's' : ''} y ` : ''}${vividos % Sim.DIAS_ANIO} días</div>
      <div class="fecha">${Sim.fechaTxt(s)}</div><div style="margin-top:3px">🌡️ ${s.clima.temp ?? '–'} °C · 💧 ${s.clima.hum ?? '–'} %${s.clima.granizando ? ' · 🧊 granizo' : ''}${s.clima.ola > 0 ? ' · 🔥 ola de calor' : ''}${s.clima.frente > 0 ? ' · 🌬️ frente frío' : ''}</div>${clima ? `<div style="margin-top:3px">${clima}</div>` : ''}</div>
    ${ficha}
    <div class="card"><h4>Despensa</h4><div class="grid">
      <span>🥔 Raciones</span><b class="${dias < 4 ? 'warn' : ''}">${Math.floor(R.raciones)} · ≈${dias} d</b>
      <span>🥚 Huevos</span><b>${Math.floor(R.huevos)}</b>
      <span>🥛 Leche</span><b>${R.leche.toFixed(1)} L</b>
      <span>🚰 Potable</span><b class="${R.potable < 6 ? 'warn' : ''}">${Math.floor(R.potable)} L</b>
      <span>🛢️ Tanque</span><b>${Math.floor(R.cruda)} L</b>
      ${R.conservas >= 1 ? `<span>🫙 Conservas</span><b>${Math.floor(R.conservas)}</b>` : ''}
      ${R.queso >= 0.5 ? `<span>🧀 Queso</span><b>${Math.floor(R.queso)}</b>` : ''}
      ${R.secos >= 1 ? `<span>☀️ Secos</span><b>${Math.floor(R.secos)}</b>` : ''}
      <span>🌱 Semillas</span><b>${sem}</b></div></div>
    <div class="card"><h4>Granja</h4><div class="grid">
      <span>🌾 Pasto</span><b>${Math.round(s.granja.pasto)} %</b>
      <span>🟨 Heno</span><b>${Math.round(R.heno)}</b>
      <span>🧶 Lana</span><b>${Math.round(R.lana)} · ${R.abrigos} abrigo${R.abrigos === 1 ? '' : 's'}</b>
      <span>🍼 Nacidos</span><b>${s.stats.nacimientos || 0}</b>
      <span>🧪 Suelo N·P·K</span><b class="${Math.min(prom('N'), prom('P'), prom('K')) < 35 ? 'warn' : ''}">${Math.round(prom('N'))} · ${Math.round(prom('P'))} · ${Math.round(prom('K'))}</b>
      <span>⚗️ pH medio</span><b>${prom('ph').toFixed(1)}</b>
      ${plagas ? `<span>🐛 Plagas</span><b class="warn">${plagas} parcela${plagas > 1 ? 's' : ''}</b>` : ''}
      <span>♻️ Compost</span><b>${Math.round(R.compost || 0)}</b>
      ${(() => {
        const vc = vivosG; if (!vc.length) return '';
        const pg = (k) => (vc.reduce((t, g) => t + Sim.gen(g, k), 0) / vc.length).toFixed(2);
        const est = vc.reduce((t, g) => t + (g.estres || 0), 0) / vc.length, cons = vc.reduce((t, g) => t + (g.consang || 0), 0) / vc.length;
        return `<span>🧬 Rebaño</span><b title="Resistencia ×${pg('resistencia')} · Crecimiento ×${pg('crecimiento')}">🥛${pg('leche')} 🧶${pg('lana')} 🥚${pg('huevos')}</b>
        <span>😣 Estrés animal</span><b class="${est > 50 ? 'warn' : ''}">${Math.round(est)}</b>
        ${cons > 0.005 ? `<span>🩺 Consanguinidad</span><b class="${cons > 0.15 ? 'warn' : ''}">${Math.round(cons * 100)} %</b>` : ''}`;
      })()}</div>
      <div class="animales" style="margin-top:6px">${animales}</div>
      <div style="margin-top:6px;font-size:12px;color:rgba(241,238,232,.75)">Huerto: ${huerto}</div></div>
    <div class="card"><h4>Hogar</h4><div class="grid">
      ${hum === 2 ? `<span>💞 Relación</span><b class="${s.pareja.afinidad < 35 ? 'warn' : ''}">${Math.round(s.pareja.afinidad)} / 100</b>` : ''}
      ${hum === 2 && s.pareja.tension > 5 ? `<span>😤 Tensión</span><b class="${s.pareja.tension > 40 ? 'warn' : ''}">${Math.round(s.pareja.tension)}</b>` : ''}
      <span>🧹 Limpieza</span><b class="${s.casa.limpieza < 30 ? 'warn' : ''}">${Math.round(s.casa.limpieza)} %</b>
      <span>🌸 Belleza</span><b>${s.belleza ?? 0}</b>
      ${(() => { const o = (s.obras || []).find((x) => x.progreso < 1); return o ? `<span>🏗️ Obra</span><b title="${o.nombre}">${Math.round(o.progreso * 100)} %</b>` : ''; })()}
      ${s.esculturas ? `<span>🗿 Esculturas</span><b>${s.esculturas}</b>` : ''}
      <span>🔨 Estado</span><b class="${(s.casa.estado ?? 100) < 40 ? 'warn' : ''}">${Math.round(s.casa.estado ?? 100)} %</b>
      ${(s.desbloqueos || []).length ? `<span>🔓 Mejoras</span><b title="${s.desbloqueos.map((k) => Object.values(Sim.DESBLOQUEOS).flat().find((d) => d[1] === k)?.[2]).join(', ')}">${s.desbloqueos.length}</b>` : ''}</div></div>
    <div class="card" data-tab="diario"><h4>Diario</h4><ul class="diario">${s.diario.slice(0, angosto() ? 12 : 5).map((e) => `<li class="${e.tipo}">${e.texto}</li>`).join('')}</ul></div>
    ${s.fin ? `<div class="card" style="color:#ffcf8a">La granja quedó vacía tras ${s.fin.dias} días. Pronto llega otra generación…</div>` : ''}`;
}
setInterval(pintarDatos, 500);

// ---------------------------------------------------------------- control de velocidad y botón de datos
const speeds = document.getElementById('speeds');
const pintar = () => [...speeds.querySelectorAll('button')].slice(0, VELOCIDADES.length).forEach((b, i) => b.classList.toggle('on', i === vel));
VELOCIDADES.forEach(([, txt], i) => {
  const b = document.createElement('button'); b.textContent = txt;
  b.onclick = () => { vel = i; pintar(); try { localStorage.setItem('granja3d-vel2', i); } catch { /* sin almacenamiento */ } };
  speeds.append(b);
});
// pestañas del panel de datos en el celular
const tabs = document.getElementById('tabs');
const TABS = [['pj', '👥 Personajes'], ['granja', '🌾 Granja'], ['diario', '📖 Diario']];
const elegirTab = (k) => { TABS.forEach(([t]) => document.body.classList.toggle('tab-' + t, t === k)); [...tabs.children].forEach((b, i) => b.classList.toggle('on', TABS[i][0] === k)); };
TABS.forEach(([k, txt]) => { const b = document.createElement('button'); b.textContent = txt; b.onclick = () => elegirTab(k); tabs.append(b); });
elegirTab('pj');
const bDatos = document.createElement('button');
function aplicarDatos() { tabs.classList.toggle('off', !datos); bDatos.classList.toggle('on', datos); bDatos.textContent = datos ? 'Datos ✓' : 'Datos'; izq.classList.toggle('off', !datos); der.classList.toggle('off', !datos); encuadre(); pintarDatos(); }
bDatos.onclick = () => { datos = !datos; aplicarDatos(); };
speeds.append(bDatos);
pintar(); aplicarDatos();
addEventListener('resize', encuadre);
let idle;
const mostrar = () => { speeds.classList.remove('hide'); clearTimeout(idle); idle = setTimeout(() => speeds.classList.add('hide'), 2500); };
addEventListener('pointermove', mostrar); addEventListener('pointerdown', mostrar); mostrar();
addEventListener('keydown', (e) => {
  if (e.ctrlKey || e.altKey || e.metaKey || e.repeat) return;
  const i = { Digit1: 0, Digit2: 1, Digit3: 2, Digit4: 3 }[e.code];
  if (i != null) { vel = i; pintar(); mostrar(); }
  if (e.code === 'KeyD') { datos = !datos; aplicarDatos(); mostrar(); }
});

const caption = document.getElementById('caption');
function aviso(txt) { caption.textContent = txt; caption.classList.add('on'); setTimeout(() => caption.classList.remove('on'), 5000); }
if (estado.generacion > 1 && Sim.diasVividos(estado) < 1) aviso(`Generación ${estado.generacion}`);

// guardado
const guardar = () => Sim.guardar(estado);
addEventListener('pagehide', guardar);
document.addEventListener('visibilitychange', () => { if (document.hidden) guardar(); });
setInterval(guardar, 30000);

// bucle
let last = performance.now(), t = 0, finEn = null;
function loop(now) {
  const dt = Math.min((now - last) / 1000, 0.1); last = now; t += dt;
  if (!estado.fin) Sim.avanzar(estado, dt * VELOCIDADES[vel][0]);
  else {
    if (finEn == null) { Sim.registrarGeneracion(estado); finEn = t + 20; guardar(); }
    if (t > finEn) { estado = nueva(estado.generacion + 1); finEn = null; guardar(); crearTarjetas(); aviso(`Generación ${estado.generacion}`); }
  }
  escena.update(estado, t, dt);
  if (escena.cargada) { const l = document.getElementById('loader'); if (l) { l.style.opacity = 0; setTimeout(() => l.remove(), 600); } }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
