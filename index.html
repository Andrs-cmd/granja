<style>

<script type="module">
import * as Sim from './js/sim.js';
import { crearEscena } from './js/escena.js';

// velocidades: minutos de juego por segundo real (×120 → un día dura 12 minutos)
const VELOCIDADES = [[1, '×60'], [2, '×120'], [10, '×600'], [60, '×3600']];
const VEL_DEFECTO = 1;
const MAX_AUSENCIA = 30 * Sim.MIN_DIA;

const ahoraEnMinutos = () => { const d = new Date(); return d.getHours() * 60 + d.getMinutes(); };
const nueva = (generacion = 1, plano = {}) => Sim.nuevaPartida({ inicio: ahoraEnMinutos(), generacion, plano });   // la nueva generación hereda la distribución

let vel = VEL_DEFECTO;
try { const v = localStorage.getItem('granja3d-vel2'); if (v != null) vel = Math.max(0, Math.min(VELOCIDADES.length - 1, +v)); } catch { /* sin almacenamiento */ }

let estado = Sim.cargar();
// la granja sigue viviendo con la página cerrada (o la pestaña oculta), al mismo ritmo;
// ese tiempo se simula por partes en los cuadros siguientes para no congelar la pantalla
let pendiente = 0;
const ponerAlDia = (min) => { if (min > 0 && Number.isFinite(min)) pendiente = Math.min(MAX_AUSENCIA, pendiente + min); };
if (estado && estado.guardadoReal && !estado.fin) ponerAlDia(((Date.now() - estado.guardadoReal) / 1000) * VELOCIDADES[vel][0]);
if (!estado) estado = nueva(1 + Math.max(0, ...Sim.historial().map((h) => h.generacion)));
let ocultoDesde = null;
document.addEventListener('visibilitychange', () => {
  if (document.hidden) ocultoDesde = Date.now();
  else if (ocultoDesde) { ponerAlDia(((Date.now() - ocultoDesde) / 1000) * VELOCIDADES[vel][0]); ocultoDesde = null; }
});

let parcelaSel = null;   // ficha de la parcela que se toque
let fichaId = null;
let modoCalidad = 'auto'; try { modoCalidad = localStorage.getItem('granja3d-calidad') || 'auto'; } catch { /* sin almacenamiento */ }
const escena = crearEscena(document.getElementById('stage'), { modoCalidad, onParcela: (i) => { parcelaSel = parcelaSel === i ? null : i; escena.seleccionar(parcelaSel); pintarDatos(); }, onAgente: (id) => { fichaId = fichaId === id ? null : id; pintarJugador(true); } });
// acceso de depuración desde la consola (no afecta la simulación)
window.granja = { get estado() { return estado; }, escena, ficha: (id) => { fichaId = id; pintarJugador(true); } };

// ---------------------------------------------------------------- columnas de datos
const izq = document.getElementById('izq'), der = document.getElementById('der');
const angosto = () => innerWidth <= 640;
let datos = !angosto() && innerHeight > 480;   // en el celular (de pie o acostado) arrancan ocultos: el orbe ocupa la pantalla
const altoDilema = () => document.body.classList.contains('con-dilema') ? document.getElementById('dilema').getBoundingClientRect().height + 12 : 0;
function encuadre() {
  if (!datos) return escena.encuadrar(0, 0, 0, innerHeight <= 480 ? altoDilema() : 0);   // celular acostado: el dilema va arriba
  if (angosto()) {   // en el celular los datos van en un panel abajo (y el dilema, si hay, arriba)
    return escena.encuadrar(0, 0, innerHeight * 0.36 + 58 + 36, altoDilema());
  }
  const ancho = izq.getBoundingClientRect().width || 232;
  escena.encuadrar(ancho + 44, ancho + 44, 0);
}
const NECS = [['comida', '🍽'], ['agua', '💧'], ['energia', '⚡'], ['salud', '❤']];
const EMO = { tomas: '👨', lucia: '👩', nube: '🐕', esmoquin: '🐈‍⬛' };
const EMO_G = { vaca: '🐄', oveja: '🐑', gallina: '🐔', gallo: '🐓' };
const ICO = { lechuga: '🥬', papa: '🥔', frijol: '🫘', maiz: '🌽' };
const OFI = { huerto: '🌱', agua: '💧', cuidado: '🩹', casa: '🍳', granja: '🐄', carpinteria: '🔨', pesca: '🎣', escultura: '🗿', deporte: '💪', natacion: '🏊', lectura: '📖', juegos: '♟', skate: '🛹' };
const tarjetas = {};
function crearTarjetas() {
  izq.replaceChildren();
  for (const a of estado.agentes) {
    const c = document.createElement('div'); c.className = 'card pj';
    c.innerHTML = `<div class="top"><span class="cara"></span><b></b></div><div class="act"></div><div class="bars">${NECS.map(([k, ic]) => `<i title="${k}">${ic}<u><em data-k="${k}"></em></u></i>`).join('')}</div><div class="extra"></div>`;
    izq.append(c);
    tarjetas[a.id] = c;
  }
}
crearTarjetas();
function pintarDatos() {
  if (!datos) return;
  const s = estado, R = s.rec;
  if (s.agentes.some((a) => !tarjetas[a.id])) crearTarjetas();   // nació alguien: su tarjeta
  for (const a of s.agentes) {
    const c = tarjetas[a.id]; if (!c) continue;
    c.classList.toggle('muerto', !a.vivo);
    const etapa = a.tipo === 'nino' ? Sim.etapaDe(s, a) : null;
    c.querySelector('.cara').textContent = a.tipo === 'humano' && a.vivo ? Sim.caraAnimo(a.animo) : etapa ? { bebe: '👶', nino: a.sexo === 'm' ? '👧' : '👦', joven: '🧑', adulto: '🧑' }[etapa] : EMO[a.id] || (a.tipo === 'perro' ? '🐕' : a.tipo === 'gato' ? '🐈' : '•');
    c.querySelector('b').textContent = (a.vivo ? '' : '† ') + a.nombre + (a.enfermo > 0 ? ' 🤒' : '');
    c.querySelector('.act').textContent = a.vivo ? (a.dentro ? `En casa · ${a.accion.toLowerCase()}` : a.accion) : a.seFue ? (a.accion || a.causa) : `Murió ${a.causa || ''}`;
    c.querySelector('.bars').style.display = a.vivo ? '' : 'none';
    // rasgos, deseo, oficios y vínculo
    const rasgos = a.rasgos.map((r) => Sim.RASGOS[r]?.nombre).filter(Boolean).join(' · ');
    let extra = `<div title="${a.rasgos.map((r) => Sim.RASGOS[r]?.desc).join(' · ')}">${rasgos}</div>`;
    if (a.vivo && etapa) {   // hijo: etapa, días de vida y lo que aprendió mirando a sus padres
      extra += `<div class="deseo">${Sim.ETAPA_NOMBRE[etapa]} · ${Sim.diasDeVida(s, a)} días${a.padres?.length ? '' : ''}</div>`;
      const ofi = Object.entries(a.xp || {}).map(([k, v]) => [k, Sim.nivel(v)]).filter(([, n]) => n > 0).sort((x, y) => y[1] - x[1]).slice(0, 4);
      if (ofi.length) extra += `<div class="ofi" title="Lo que aprendió (nivel)">${ofi.map(([k, n]) => `${OFI[k] || ''}${n}`).join('  ')}</div>`;
    } else if (a.vivo && a.tipo === 'humano') {
      if (a.embarazada && s.familia?.embarazo) extra += `<div class="deseo">🤰 Embarazada · el bebé llega en ${Math.max(0, Math.ceil((s.familia.embarazo.fin - s.t) / Sim.MIN_DIA))} días</div>`;
      if (a.deseo) extra += `<div class="deseo">✨ ${a.deseo.texto}</div>`;
      if (a.pensamiento && s.t - a.pensamiento.t < 600) extra += `<div class="piensa">💭 ${esc(a.pensamiento.texto)}</div>`;
      const ofi = Object.entries(a.xp || {}).map(([k, v]) => [k, Sim.nivel(v)]).filter(([, n]) => n > 0).sort((x, y) => y[1] - x[1]).slice(0, 6);
      if (ofi.length) extra += `<div class="ofi" title="Oficios (nivel)">${ofi.map(([k, n]) => `${OFI[k] || ''}${n}`).join('  ')}</div>`;
      const PL = a.placer || {}, est = [];
      if (a.resacaHasta > s.t) est.push('🥴 resaca'); else if (a.borrachoHasta > s.t) est.push('🍷 entonado');
      if (a.colocadoHasta > s.t) est.push('🌿 relajado');
      for (const [k, ic] of [['vino', '🍷'], ['hierba', '🌿']]) { const d = PL[k]?.dep || 0; if (PL[k]?.pausa > Sim.dia(s)) est.push(`${ic} lo está dejando`); else if (d > 0.3) est.push(`<span class="warn">${ic} dependencia ${Math.round(d * 100)} %</span>`); }
      if ((a.deseoSex || 0) > 70) est.push('💗 con ganas');
      est.push(`💪 forma ${Math.round(a.forma ?? 40)}`);
      if (est.length) extra += `<div title="Vino: ${PL.vino?.usos || 0} veces · Hierba: ${PL.hierba?.usos || 0} veces">${est.join(' · ')}</div>`;
    } else if (a.vivo && a.vinculo && (a.crec ?? 1) < 1) {
      extra += `<div class="deseo">${a.tipo === 'perro' ? 'Cachorro' : 'Gatito'} · ${Math.round((a.crec || 0) * 28)} días</div>`;
    } else if (a.vivo && a.vinculo) {
      const fav = Object.entries(a.vinculo).sort((x, y) => y[1] - x[1])[0];
      const h = s.agentes.find((x) => x.id === fav?.[0]);
      if (h) extra += `<div>♥ ${h.nombre} (${Math.round(fav[1])})</div>`;
    }
    const ex = c.querySelector('.extra'); if (ex.innerHTML !== extra) ex.innerHTML = extra;
    c.querySelectorAll('em').forEach((em) => { const v = Math.max(0, Math.min(100, a.n[em.dataset.k])); em.style.width = v + '%'; em.className = v < 25 ? 'low' : v < 50 ? 'mid' : ''; });
  }
  const hum = s.agentes.filter((a) => a.vivo && a.tipo === 'humano').length;
  const consumo = hum * 1.4 + s.agentes.filter((a) => a.vivo && a.tipo !== 'humano').length * 0.5;
  const dias = consumo ? Math.floor(Sim.comidaTotal(s) / consumo) : 0;
  const vividos = Sim.diasVividos(s), años = Math.floor(vividos / Sim.DIAS_ANIO);
  const clima = s.sequia > 0 ? '☀️ sequía' : s.clima.lluvia ? '🌧️ lluvia' : s.clima.arcoiris > s.t ? '🌈 arcoíris' : '';
  const sem = Object.entries(R.semillas).map(([k, v]) => `${ICO[k]}${v}`).join(' ');
  const grupos = [
    ['🐄', 'vaca|vacas', (g) => g.tipo === 'vaca' && g.sexo === 'h' && g.crec >= 1], ['🐂', 'toro|toros', (g) => g.tipo === 'vaca' && g.sexo === 'm' && g.crec >= 1],
    ['🐑', 'oveja|ovejas', (g) => g.tipo === 'oveja' && g.sexo === 'h' && g.crec >= 1], ['🐏', 'carnero|carneros', (g) => g.tipo === 'oveja' && g.sexo === 'm' && g.crec >= 1],
    ['🐔', 'gallina|gallinas', (g) => g.tipo === 'gallina'], ['🐓', 'gallo|gallos', (g) => g.tipo === 'gallo'],
    ['🍼', 'cría|crías', (g) => g.crec < 1 && g.tipo !== 'pollito'], ['🐣', 'pollito|pollitos', (g) => g.tipo === 'pollito'],
  ];
  const vivosG = s.ganado.filter((g) => g.vivo);
  const fichaAnimal = (g) => `${g.nombre} · gen. ${g.generacion || 0}${g.rasgo ? ' · ' + g.rasgo : ''} · estrés ${Math.round(g.estres || 0)}`;

function plazo(d) {
  const r = Math.max(0, d.vence - estado.t), h = Math.floor(r / 60), m = Math.floor(r % 60);

      ${def ? `<div class="sino"><b>Si no decides:</b> ellos harán «${esc(def.txt)}»${def.pista ? ` — ${esc(def.pista)}` : ''}.</div>` : ''}</div>`;

// pestañas del panel de datos en el celular
const tabs = document.getElementById('tabs');
const TABS = [['pj', '👥 Personajes'], ['granja', '🌾 Granja'], ['diario', '📖 Diario']];
const elegirTab = (k) => { TABS.forEach(([t]) => document.body.classList.toggle('tab-' + t, t === k)); [...tabs.children].forEach((b, i) => b.classList.toggle('on', TABS[i][0] === k)); };
TABS.forEach(([k, txt]) => { const b = document.createElement('button'); b.textContent = txt; b.onclick = () => elegirTab(k); tabs.append(b); });
elegirTab('pj');
const bDatos = document.createElement('button');
function aplicarDatos() { document.body.classList.toggle('datos', datos); tabs.classList.toggle('off', !datos); bDatos.classList.toggle('on', datos); bDatos.textContent = datos ? 'Datos ✓' : 'Datos'; izq.classList.toggle('off', !datos); der.classList.toggle('off', !datos); encuadre(); pintarDatos(); }
bDatos.onclick = () => { datos = !datos; aplicarDatos(); };
speeds.append(bDatos);
{ const b = document.createElement('button'); b.textContent = '👁'; b.title = 'Elegir un personaje y seguirlo con la cámara'; b.onclick = () => abrirElegir(); speeds.append(b); }
{ const NOM = { auto: 'HD auto', alta: 'HD alta', ultra: 'HD ultra' }, SIG = { auto: 'alta', alta: 'ultra', ultra: 'auto' };
  const b = document.createElement('button'); b.textContent = NOM[modoCalidad] || NOM.auto; b.title = 'Calidad de imagen: auto se ajusta al equipo; alta y ultra se ven más nítidas (más exigentes)';
  b.onclick = () => { const n = SIG[modoCalidad] || 'auto'; try { localStorage.setItem('granja3d-calidad', n); } catch { /* sin almacenamiento */ } guardar(); location.reload(); }; speeds.append(b); }
{ const b = document.createElement('button'); b.textContent = '⚡'; b.title = 'Poderes del orbe'; b.onclick = () => abrirVida('poderes'); speeds.append(b); }
{ const b = document.createElement('button'); b.textContent = '📈'; b.title = 'Crónica: cómo ha cambiado el orbe'; b.onclick = () => abrirVida('cronica'); speeds.append(b); }
{ const b = document.createElement('button'); b.textContent = '🔮'; b.title = 'Otros orbes'; b.onclick = () => { guardar(); location.href = 'mundos/index.html'; }; speeds.append(b); }   // la galería de mundos
// en el celular no caben todos: los extras van a un menú «⋯» (con su nombre escrito)
const EXTRAS = [...speeds.querySelectorAll('button')].slice(VELOCIDADES.length + 1).map((b) => ({ b, icono: b.textContent, etq: { '👁': '👁 Seguir a alguien', '⚡': '⚡ Poderes y naturaleza', '📈': '📈 Crónica', '🔮': '🔮 Otros orbes' }[b.textContent] || b.textContent }));
const menuMas = document.createElement('div'); menuMas.className = 'menuMas off'; document.body.append(menuMas);
const bMas = document.createElement('button'); bMas.textContent = '⋯'; bMas.title = 'Más opciones'; bMas.className = 'mas'; speeds.append(bMas);
bMas.onclick = (e) => { e.stopPropagation(); menuMas.classList.toggle('off'); };
menuMas.addEventListener('click', () => menuMas.classList.add('off'));
addEventListener('pointerdown', (e) => { if (!menuMas.contains(e.target) && e.target !== bMas) menuMas.classList.add('off'); });
const esMovil = matchMedia('(max-width: 640px)');
function acomodarBarra() {
  const m = esMovil.matches;
  for (const x of EXTRAS) { if (m) { menuMas.append(x.b); if (x.etq !== x.icono) x.b.textContent = x.etq; } else { speeds.insertBefore(x.b, bMas); x.b.textContent = x.icono; } }
  bMas.style.display = m ? '' : 'none'; if (!m) menuMas.classList.add('off');
}
esMovil.addEventListener('change', acomodarBarra); acomodarBarra();
pintar(); aplicarDatos();
addEventListener('resize', encuadre);
let idle;
const tactil = matchMedia('(pointer: coarse)').matches;   // en el celular la barra queda fija: no hay "pasar el mouse" para que aparezca
const mostrar = () => { speeds.classList.remove('hide'); clearTimeout(idle); if (!tactil) idle = setTimeout(() => speeds.classList.add('hide'), 2500); };
addEventListener('pointermove', mostrar); addEventListener('pointerdown', mostrar); mostrar();
addEventListener('keydown', (e) => {
  if (e.ctrlKey || e.altKey || e.metaKey || e.repeat) return;
  const i = { Digit1: 0, Digit2: 1, Digit3: 2, Digit4: 3 }[e.code];
  if (i != null) { vel = i; pintar(); mostrar(); }
  if (e.code === 'KeyD') { datos = !datos; aplicarDatos(); mostrar(); }
});

const caption = document.getElementById('caption');
function aviso(txt) { caption.textContent = txt; caption.classList.add('on'); setTimeout(() => caption.classList.remove('on'), 5000); }
if (estado.generacion > 1 && Sim.diasVividos(estado) < 1) aviso(`Generación ${estado.generacion}`);

// guardado
const guardar = () => Sim.guardar(estado);
addEventListener('pagehide', guardar);
document.addEventListener('visibilitychange', () => { if (document.hidden) guardar(); });
setInterval(guardar, 30000);

// bucle
let last = performance.now(), t = 0, finEn = null, fallosEscena = 0;
function loop(now) {
  requestAnimationFrame(loop);   // primero: pase lo que pase en este cuadro, el siguiente llega
  const dt = Math.min((now - last) / 1000, 0.1); last = now; t += dt;
  try {
    if (!estado.fin) {
      // ponerse al día: como máximo ~12 ms de simulación extra por cuadro
      if (pendiente > 0) {
        const t0 = performance.now();
        while (pendiente > 0 && !estado.fin && performance.now() - t0 < 12) { const m = Math.min(pendiente, 30); Sim.avanzar(estado, m); pendiente -= m; }
        caption.textContent = pendiente > 1 ? `Poniéndose al día… ${Math.ceil(pendiente / Sim.MIN_DIA)} d` : ''; caption.classList.toggle('on', pendiente > 60);
      }
      Sim.avanzar(estado, dt * VELOCIDADES[vel][0]);
    } else {
      pendiente = 0;
      if (finEn == null) { Sim.registrarGeneracion(estado); finEn = t + 20; guardar(); }
      if (t > finEn) { estado = nueva(estado.generacion + 1, estado.plano); finEn = null; guardar(); crearTarjetas(); aviso(`Generación ${estado.generacion}`); }
    }
  } catch (e) { console.warn('[granja] error en el bucle:', e); }
  escena.ocupado = pendiente > 0;
  try { escena.update(estado, t, dt); fallosEscena = 0; } catch (e) { if (fallosEscena++ === 0) console.warn('[granja] error al dibujar:', e); }
  if (escena.cargada) { const l = document.getElementById('loader'); if (l) { l.style.opacity = 0; setTimeout(() => l.remove(), 600); } }
}
requestAnimationFrame(loop);
</script>
