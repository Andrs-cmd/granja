<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Granja — simulación</title>
<style>
  :root {
    --panel: rgba(20, 21, 26, .86); --line: rgba(255,255,255,.09); --fg: #f1eee8; --muted: #a3a09a;
    --ok: #7cc36a; --mid: #e3b341; --low: #e0574f; --accent: #e7c46a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; color: var(--fg); font: 14px/1.4 "Inter", system-ui, -apple-system, Segoe UI, sans-serif; }
  body { background: radial-gradient(ellipse at 38% 45%, #e9e5de 0%, #cfcac1 42%, #5d5952 100%); }
  #stage { position: fixed; inset: 0 380px 0 0; }
  #stage canvas { display: block; width: 100%; height: 100%; cursor: grab; }
  .vignette { position: fixed; inset: 0 380px 0 0; pointer-events: none; background: radial-gradient(ellipse at 50% 50%, transparent 50%, rgba(6,6,10,.5) 80%, rgba(4,4,8,.85) 100%); }
  button { font: inherit; color: inherit; cursor: pointer; }

  /* barra superior */
  .top { position: fixed; top: 0; left: 0; right: 380px; display: flex; align-items: center; gap: 14px; padding: 14px 18px; flex-wrap: wrap; z-index: 3; }
  .brand { font-weight: 700; letter-spacing: .14em; text-transform: uppercase; font-size: 13px; text-shadow: 0 1px 8px rgba(0,0,0,.5); }
  .brand span { display: block; font-weight: 500; letter-spacing: .02em; text-transform: none; color: #e9e5de; opacity: .8; font-size: 12px; }
  .fecha { margin-left: auto; font: 600 14px ui-monospace, Consolas, monospace; background: var(--panel); padding: 7px 12px; border-radius: 10px; border: 1px solid var(--line); }
  .clima { font-size: 20px; background: var(--panel); border-radius: 10px; padding: 3px 9px; border: 1px solid var(--line); }
  .speeds { display: flex; background: var(--panel); border-radius: 10px; border: 1px solid var(--line); overflow: hidden; }
  .speed { background: none; border: 0; padding: 7px 10px; min-width: 40px; font-weight: 600; font-size: 13px; }
  .speed.on { background: var(--accent); color: #1b1a17; }
  .ghost { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 7px 12px; font-size: 13px; }

  /* panel lateral */
  .panel { position: fixed; top: 0; right: 0; bottom: 0; width: 380px; overflow-y: auto; background: #17181d; border-left: 1px solid var(--line); padding: 14px 14px 30px; z-index: 3; }
  .card { padding: 14px 4px 16px; border-bottom: 1px solid var(--line); }
  .card h3 { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); margin-bottom: 10px; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .card h3 small { letter-spacing: 0; text-transform: none; color: var(--muted); font-weight: 400; font-size: 11.5px; }
  .muted { color: var(--muted); font-size: 12.5px; }
  .agents { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .agent { background: rgba(255,255,255,.035); border: 1px solid var(--line); border-radius: 12px; padding: 10px; }
  .agent.dead { opacity: .45; filter: grayscale(1); }
  .agent-head { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .emoji { font-size: 18px; }
  .traits { display: flex; gap: 4px; flex-wrap: wrap; width: 100%; margin-top: 4px; }
  .trait { font-size: 10.5px; padding: 1px 6px; border-radius: 99px; background: rgba(231,196,106,.14); color: var(--accent); cursor: help; }
  .accion { font-size: 11.5px; color: var(--muted); margin: 6px 0 6px; min-height: 32px; }
  .bar { display: grid; grid-template-columns: 52px 1fr; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); margin-top: 3px; }
  .bar i { height: 6px; background: rgba(255,255,255,.08); border-radius: 9px; overflow: hidden; display: block; }
  .bar em { display: block; height: 100%; background: var(--ok); border-radius: 9px; transition: width .3s; }
  .bar em.mid { background: var(--mid); } .bar em.low { background: var(--low); }
  .res { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .res > div { background: rgba(255,255,255,.035); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }
  .res span { display: block; font-size: 11.5px; color: var(--muted); }
  .res b { font-size: 17px; } .res b.warn { color: var(--low); } .res small { color: var(--muted); margin-left: 6px; font-size: 11px; }
  .tank { height: 6px; border-radius: 9px; background: rgba(255,255,255,.08); margin: 10px 0; overflow: hidden; }
  .tank-fill { height: 100%; background: #3f9fc8; transition: width .3s; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .chip { font-size: 12px; padding: 3px 8px; border-radius: 99px; border: 1px solid var(--line); background: rgba(255,255,255,.04); cursor: help; }
  .chip.off { opacity: .45; }
  .lbl { font-size: 12px; color: var(--muted); }
  .plots { display: grid; gap: 8px; }
  .plot { border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; display: grid; grid-template-columns: 30px 1fr; gap: 2px 8px; cursor: pointer; background: rgba(255,255,255,.025); }
  .plot.sel { border-color: var(--accent); background: rgba(231,196,106,.08); }
  .plot[data-estado="lista"] b { color: var(--ok); } .plot[data-estado="muerta"] b { color: var(--low); }
  .pinfo { font-size: 12.5px; }
  .prog { grid-column: 2; height: 4px; border-radius: 9px; background: rgba(255,255,255,.08); overflow: hidden; display: block; }
  .prog em { display: block; height: 100%; background: var(--ok); }
  .pbtns { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 5px; margin-top: 4px; }
  .pbtns button, .actions button, .seg button { background: rgba(255,255,255,.06); border: 1px solid var(--line); border-radius: 8px; padding: 5px 9px; font-size: 12.5px; }
  .pbtns button:hover, .actions button:hover, .seg button:hover { border-color: var(--accent); }
  button.go { background: var(--accent); color: #1b1a17; border-color: transparent; font-weight: 600; }
  .row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .seg { display: flex; gap: 4px; } .seg button.on { background: var(--accent); color: #1b1a17; }
  .actions { display: flex; flex-wrap: wrap; gap: 6px; }
  .cola { list-style: none; margin-top: 10px; display: grid; gap: 4px; }
  .cola li { display: grid; grid-template-columns: 1fr auto auto; gap: 8px; align-items: center; font-size: 12.5px; padding: 5px 8px; border-radius: 8px; background: rgba(255,255,255,.035); }
  .cola small { color: var(--muted); } .cola .x { background: none; border: 0; color: var(--muted); }
  .chks { display: grid; gap: 6px; margin-bottom: 10px; }
  .chk { display: flex; gap: 8px; align-items: center; font-size: 13px; cursor: pointer; }
  .chk input { accent-color: var(--accent); width: 15px; height: 15px; }
  select { background: #22242b; color: var(--fg); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; font: inherit; font-size: 13px; }
  .range { display: grid; gap: 3px; font-size: 12.5px; margin-top: 8px; } .range input { accent-color: var(--accent); width: 100%; }
  .diario { list-style: none; display: grid; gap: 6px; font-size: 12.5px; }
  .diario li { padding-left: 10px; border-left: 2px solid var(--line); }
  .diario li small { display: block; color: var(--muted); font-size: 11px; }
  .diario .bueno { border-color: var(--ok); } .diario .malo, .diario .aviso { border-color: var(--mid); }
  .diario .muerte { border-color: var(--low); color: #f3b8b3; } .diario .logro { border-color: var(--accent); } .diario .clima { border-color: #5aa0d8; }
  .fin { position: fixed; inset: 0 380px 0 0; display: grid; place-items: center; background: rgba(8,8,12,.55); z-index: 4; }
  .fin.hidden { display: none; }
  .fin-box { background: #1b1c22; border: 1px solid var(--line); border-radius: 16px; padding: 26px 28px; max-width: 380px; text-align: center; display: grid; gap: 10px; }
  .fin-box h2 { font-size: 22px; } .fin-box button { padding: 9px 14px; border-radius: 10px; margin-top: 6px; }
  #loader { position: fixed; inset: 0; z-index: 9; display: grid; place-items: center; background: #1b1a17; color: var(--muted); font: 600 12px ui-monospace, Consolas, monospace; letter-spacing: .12em; transition: opacity .6s; }

  @media (max-width: 860px) {
    #stage, .vignette { inset: 0 0 46vh 0; }
    .top { right: 0; padding: 10px; gap: 8px; } .fecha { font-size: 12px; } .brand span { display: none; }
    .panel { top: auto; height: 46vh; width: 100%; border-left: 0; border-top: 1px solid var(--line); }
    .fin { inset: 0 0 46vh 0; }
  }
</style>
</head>
<body>
<div id="loader">CARGANDO GRANJA…</div>
<div id="stage"></div>
<div class="vignette"></div>
<div id="ui"></div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<script type="module">
import * as Sim from './js/sim.js';
import { crearEscena } from './js/escena.js';
import { crearUI } from './js/ui.js';

const MIN_POR_SEG = 20;   // a velocidad ×1, un día dura 72 s

let estado = Sim.cargar() || Sim.nuevaPartida();
let velocidad = 1;

const escena = crearEscena(document.getElementById('stage'), { onParcela: (i) => ui.seleccionar(i) });
const ui = crearUI(document.getElementById('ui'), {
  get estado() { return estado; },
  get velocidad() { return velocidad; },
  setVelocidad(v) { velocidad = v; ui.refrescar(); },
  nueva() { Sim.borrarPartida(); estado = Sim.nuevaPartida(); ui.reiniciar(); velocidad = 1; ui.refrescar(); },
  seleccionarParcela(i) { escena.seleccionar(i); },
});

// guardado automático
let ultimoDia = Sim.dia(estado);
const guardar = () => Sim.guardar(estado);
addEventListener('pagehide', guardar);
document.addEventListener('visibilitychange', () => { if (document.hidden) guardar(); });
// atajos: espacio pausa, 1-5 velocidades
addEventListener('keydown', (e) => {
  if (e.target.matches('input, select, textarea')) return;
  if (e.code === 'Space') { e.preventDefault(); velocidad = velocidad ? 0 : 1; ui.refrescar(); }
  const m = { Digit1: 1, Digit2: 5, Digit3: 20, Digit4: 100 }[e.code];
  if (m) { velocidad = m; ui.refrescar(); }
});

let acc = 0, last = performance.now(), uiTimer = 0, t = 0;
function loop(now) {
  const dt = Math.min((now - last) / 1000, 0.1); last = now; t += dt;
  if (!estado.fin) {
    acc += dt * velocidad * MIN_POR_SEG;
    const n = Math.min(Math.floor(acc), 4000);
    if (n > 0) { Sim.avanzar(estado, n); acc -= n; if (acc > 4000) acc = 0; }
  }
  if (Sim.dia(estado) !== ultimoDia) { ultimoDia = Sim.dia(estado); guardar(); }
  escena.update(estado, t, dt);
  uiTimer -= dt;
  if (uiTimer <= 0) { ui.refrescar(); uiTimer = 0.25; }
  if (escena.cargada) { const l = document.getElementById('loader'); if (l) { l.style.opacity = 0; setTimeout(() => l.remove(), 600); } }
  requestAnimationFrame(loop);
}
ui.refrescar();
requestAnimationFrame(loop);
</script>
</body>
</html>
