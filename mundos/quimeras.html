<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/" } }</script>
<script type="module">
import { crearOrbe, THREE, angLerp } from './motor/orbe3d.js';
import { $, esc, barraVelocidades, botonCalidad, aviso, panel, pintarSi, htmlDiario, htmlBarra, guardarJSON, cargarJSON } from './motor/ui.js';
import * as S from './quimeras/sim.js';
import { crearModelo, liberarModelo, animarModelo, crearArena } from './quimeras/escena.js';
const { HAB, TECNICAS, TEMPERAMENTOS, HERIDAS, PARTES, RANURAS, NOM_RANURA, nomParte, corto, xpPara } = S;

// ---------------------------------------------------------------- estado guardado
const CLAVE = 'orbe-quimeras';
let est = cargarJSON(CLAVE);
if (!est || est.v !== 1 || !Array.isArray(est.establo)) est = S.estadoInicial((Date.now() % 1e9) | 0);
est.caidos ||= []; est.opc ||= { muerte: true, cine: true };
const guardar = () => guardarJSON(CLAVE, est);
guardar();
const semilla = () => ((est.semilla * 31 + (++est.peleas) * 7919) >>> 0);
const vivos = () => est.establo.filter((c) => c.viva);
const rivalesVivos = () => est.rivales.filter((c) => c.viva);

// ---------------------------------------------------------------- orbe y coliseo
const O = crearOrbe($('#stage'), { radio: 26, colorSuelo: 0x8a7a5a, colorBase: 0x2a1e18, camara: { pos: new THREE.Vector3(0, 19, 31), target: new THREE.Vector3(0, 1.5, 0) } });
const AR = crearArena(O);
let mult = 1;
barraVelocidades($('#vels'), [['⏸', 0], ['×1', 1], ['×2', 2], ['×4', 4]], 'quimeras-vel', 1, (m) => { mult = m; });
const barra = $('#barra');
const btn = (ic, tx, fn, titulo) => { const b = document.createElement('button'); b.innerHTML = `<span class="ic">${ic}</span><span class="tx">${tx}</span>`; b.title = titulo || tx; b.onclick = fn; barra.append(b); return b; };
btn('⚔', 'Combate', () => abrirPanel('combate'), 'Preparar un combate');
btn('🏆', 'Torneo', () => abrirPanel('torneo'), 'Torneo de 8 con llaves');
btn('🧪', 'Laboratorio', () => abrirPanel('lab'), 'Crear una quimera');
btn('⋯', '', () => { pMas.alternar(); pintarMas(); }, 'Más opciones');

const pLab = panel($('#pLab'), { alCerrar: salirLab }), pCombate = panel($('#pCombate')), pTorneo = panel($('#pTorneo')), pEstablo = panel($('#pEstablo'), { alCerrar: () => { verCria = null; } }), pCronica = panel($('#pCronica')), pRes = panel($('#pRes'), { alCerrar: () => { if (combate && ctx?.cerrado) modoReposo(); } }), pMas = panel($('#pMas'));
const PANELES = { lab: pLab, combate: pCombate, torneo: pTorneo, establo: pEstablo, cronica: pCronica };
function abrirPanel(n) {
  for (const [k, p] of Object.entries(PANELES)) if (k !== n && p.abierto) p.cerrar();
  pMas.cerrar(); if (pRes.abierto) pRes.cerrar();
  if (n === 'lab') { if (combate && !ctx?.cerrado) return aviso('Espera a que termine la pelea.'); entrarLab(); }
  if (n === 'combate') { if (combate && !combate.fin) return aviso('Ya hay una pelea en curso.'); prepCombate.sel = null; pintarCombate(); }
  if (n === 'torneo') pintarTorneo();
  if (n === 'establo') pintarEstablo();
  if (n === 'cronica') pintarCronica();
  PANELES[n].abrir();
}

// ---------------------------------------------------------------- actores en la arena
const etqs = $('#etqs');
let combate = null, ctx = null, actores = [], tAnim = 0, hora = 16.5;
function limpiarActores() { for (const a of actores) { liberarModelo(a.M); a.etq?.remove(); } actores = []; }
function actor(cr, x, z, ang, conEtq = true) {
  const M = crearModelo(cr); M.g.position.set(x, 0, z); M.g.rotation.y = ang; M.g.userData.id = cr.id; O.mundo.add(M.g);
  let etq = null; if (conEtq) { etq = document.createElement('div'); etq.className = 'etq'; etqs.append(etq); }
  const a = { cr, M, etq, x, z, ang, anim: 'quieto', rap: 0, obj: null, pausa: 1 + Math.random() * 2 }; actores.push(a); return a;
}
// en reposo: tus quimeras pasean por la arena (se ve quién está herido: cojea y va más lento)
function modoReposo() {
  combate = null; ctx = null; limpiarActores(); O.seguir(null);
  vivos().sort((a, b) => b.fama - a.fama || b.nivel - a.nivel).slice(0, 3).forEach((cr, i) => actor(cr, Math.cos(i * 2.1) * 5, Math.sin(i * 2.1) * 5, i));
  pintarHud(); pintarCols();
}
const ESTADO_IC = { veneno: ['🟢', 'Envenenado'], sangrado: ['🩸', 'Sangrando'], aturdido: ['💫', 'Aturdido'], miedo: ['😱', 'Asustado'], vuelo: ['🪽', 'Volando'], ceguera: ['🌑', 'Cegado'], lento: ['🕸', 'Enredado'], atrapado: ['⛓', 'Atrapado'], escudo: ['🛡', 'En su caparazón'], furia: ['🔥', 'Enfurecido'], agarrando: ['🤼', 'Apretando'] };
const iconos = (L) => Object.keys(L.ef).map((k) => ESTADO_IC[k] ? `<span title="${ESTADO_IC[k][1]}">${ESTADO_IC[k][0]}</span>` : '').join('');
const fmtT = (t) => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;

// ---------------------------------------------------------------- combate en vivo
let diario = [];
// reanudar = { semilla, t }: la simulación es determinista, así que repetir los mismos pasos devuelve la pelea exacta donde quedó
function iniciarCombate(a, b, tipo, extra = {}, reanudar = null) {
  [pCombate, pTorneo, pLab, pEstablo, pCronica, pRes, pMas].forEach((p) => p.abierto && p.cerrar());
  limpiarActores(); preview = null;
  const sem = reanudar ? reanudar.semilla : semilla();
  combate = S.crearCombate(a, b, sem);
  if (reanudar) { while (combate.t < reanudar.t - 1e-6 && !combate.fin) S.pasoCombate(combate, S.TICK); combate.ev.length = 0; }
  ctx = { tipo, finT: 0, cerrado: false, ...extra, coroT: 6, frasesT: 0, fav: favorito(a, b) };
  est.enCurso = { a: a.id, b: b.id, tipo, semilla: sem, t: combate.t, apuesta: ctx.apuesta || null }; guardar();
  combate.L.forEach((L) => actor(L.cr, L.x, L.z, L.ang));
  hora = tipo === 'torneo' ? 16.5 + est.torneo.ronda * 0.8 : 12 + (est.jornada % 5) * 1.0; O.setHora(hora);   // de día se ve bien la pelea; los torneos cierran al atardecer
  diario = [{ texto: `${S.nombreDe(a)} (nv ${a.nivel}, ${TEMPERAMENTOS[a.temp].nom.toLowerCase()}) contra ${S.nombreDe(b)} (nv ${b.nivel}, ${TEMPERAMENTOS[b.temp].nom.toLowerCase()}).`, tipo: 'logro', d: '0:00' }];
  if (ctx.apuesta) diario.unshift({ texto: `Apostaste ${ctx.apuesta.monto} 🪙 por ${corto(ctx.apuesta.lado ? b : a)} a ×${ctx.apuesta.cuota.toFixed(2)}.`, tipo: '', d: '0:00' });
  $('#colIzq').classList.remove('off'); $('#colDer').classList.remove('off');
  // vuelo suave a un plano frontal alto: los dos luchadores quedan lado a lado y la distancia se ajusta al ancho de la pantalla
  volarA(centroPelea() || new THREE.Vector3(0, 1.6, 0), offFrente(distEncuadre(12)), 1.3);
  if (reanudar) { diario.unshift({ texto: 'Se reanuda el combate que quedó a medias.', tipo: 'logro', d: fmtT(combate.t) }); locutor('¡Volvemos a la arena! La pelea sigue donde quedó.'); }
  else locutor(frase('inicio', { A: corto(a), B: corto(b), F: corto(ctx.fav ? b : a) }), 4500);
  if (mult === 0) aviso('Está en pausa: dale ×1 para que empiece.');
}
// favorito del público: el más famoso; si empatan, el más potente
function favorito(a, b) { return b.fama > a.fama || (b.fama === a.fama && S.potencia(b) > S.potencia(a)) ? 1 : 0; }

// ---------------------------------------------------------------- cámara propia: vuelos suaves que nunca bajan tras el muro
let vueloCam = null, lento = 0;
const _s0 = new THREE.Spherical(), _s1 = new THREE.Spherical(), _o = new THREE.Vector3(), _t = new THREE.Vector3(), MAX_PHI = 1.08; // ≥ 28° de elevación
function volarA(obj, off, dur = 1.1) { O.seguir(null); vueloCam = { t: 0, dur, t0: O.controls.target.clone(), t1: obj.clone(), s0: _s0.clone().setFromVector3(O.camera.position.clone().sub(O.controls.target)), s1: new THREE.Spherical().setFromVector3(off) }; }
// distancia para que quepa un ancho «sep» (más márgenes) en el campo de visión horizontal
function distEncuadre(sep) { const hf = 2 * Math.atan(Math.tan(O.camera.fov * Math.PI / 360) * O.camera.aspect), vf = O.camera.fov * Math.PI / 180; return Math.max(13, Math.min(42, (sep / 2 + 3.2) / Math.tan(Math.min(hf, vf) / 2))); }
const offFrente = (dist) => new THREE.Vector3(0, Math.sin(0.62) * dist, Math.cos(0.62) * dist);
function camara(dtReal) {
  const C = O.camera, T = O.controls.target;
  if (vueloCam) {
    const v = vueloCam; v.t = Math.min(1, v.t + dtReal / v.dur); const k = v.t * v.t * (3 - 2 * v.t);
    // se interpola en esféricas (radio, elevación, giro) y no en línea recta: así el camino no atraviesa gradas ni muro
    const phi = Math.min(MAX_PHI, v.s0.phi + (Math.min(MAX_PHI, v.s1.phi) - v.s0.phi) * k);
    _s1.set(v.s0.radius + (v.s1.radius - v.s0.radius) * k, phi, angLerp(v.s0.theta, v.s1.theta, k));
    T.lerpVectors(v.t0, v.t1, k); C.position.copy(T).add(_o.setFromSpherical(_s1));
    if (v.t >= 1) vueloCam = null; return;
  }
  if (!combate || !est.opc.cine || actores.length < 2) return;
  // encuadre de cine: sigue el centro de la pelea y se aleja o acerca para que quepan ambos (y al final, el remate y el ganador)
  const [a, b] = actores, f = combate.fin; let foco, dist;
  if (f && lento > 0) { foco = actores[1 - f.ganador].M.g.position; dist = 9; }
  else if (f) { foco = actores[f.ganador].M.g.position; dist = 13; }
  else { foco = centroPelea(); dist = distEncuadre(Math.hypot(a.M.g.position.x - b.M.g.position.x, a.M.g.position.z - b.M.g.position.z)); }
  const k = Math.min(1, dtReal * 2.2);
  _t.set(foco.x, 1.6, foco.z); T.lerp(_t, k);
  _s0.setFromVector3(_o.copy(C.position).sub(T)); _s0.radius += (dist - _s0.radius) * Math.min(1, dtReal * 1.6); _s0.phi = Math.min(MAX_PHI, _s0.phi);
  C.position.copy(T).add(_o.setFromSpherical(_s0));
}

// ---------------------------------------------------------------- locutor y coro del público
const FRASES = {
  inicio: ['¡Damas y caballeros! En esta esquina, {A}… ¡y en la otra, {B}!', '¡Que ruede la arena! {A} contra {B}.', 'Las apuestas favorecen a {F}. ¿Habrá sorpresa esta tarde?', '¡Silencio en las gradas! {A} y {B} se miden las garras.', 'Dos bestias, una arena, un solo ganador: ¡{A} contra {B}!', 'El público ya grita el nombre de {F}. ¡Empieza la pelea!'],
  critico: ['¡Uy, qué golpe!', '¡Eso dolió hasta en las gradas!', '¡Directo y sin piedad!', '¡La arena se estremece!', '¡Qué zarpazo, señores!'],

  pintarSi($('#labNom'), `<div class="nomQ">${esc(S.nombreQuimera(lab.partes))}<small>potencia ${S.potencia(cr)}</small></div>`);
  pintarSi($('#labPartes'), RANURAS.map((r) => `<div class="fila"><span>${NOM_RANURA[r]}</span><div class="chips scroll">${PARTES[r].map((p) => `<button class="${lab.partes[r] === p.id ? 'on' : ''}" data-r="${r}" data-id="${p.id}">${esc(nomParte(r, p.id))}</button>`).join('')}</div></div>`).join('')
    + `<div class="fila"><span>Temperamento</span><div class="chips">${S.TEMPS.map((t) => `<button class="${lab.temp === t ? 'on' : ''}" data-temp="${t}" title="${TEMPERAMENTOS[t].desc}">${TEMPERAMENTOS[t].nom}</button>`).join('')}</div><div style="font-size:11px;opacity:.7;margin-top:3px">${TEMPERAMENTOS[lab.temp].desc}</div></div>`);
  pintarSi($('#labStats'), `<h5>Estadísticas</h5>${htmlStats(e)}<h5>Habilidades</h5>${htmlHabs(e)}`);
  $('#labGuardar').textContent = gratis ? 'Criar gratis y guardar' : `Criar y guardar (−${COSTO} 🪙)`;
  $('#labGuardar').disabled = !gratis && est.monedas < COSTO;
}
$('#labPartes').addEventListener('click', (e) => {
  const t = e.target.closest('button'); if (!t) return;
  if (t.dataset.r) { lab.partes = { ...lab.partes, [t.dataset.r]: t.dataset.id }; armarPreview(); }
  if (t.dataset.temp) lab.temp = t.dataset.temp;
  pintarLab();
});
$('#labAzar').onclick = () => { lab.partes = S.partesAzar(Math.random); lab.temp = S.TEMPS[Math.floor(Math.random() * 3)]; armarPreview(); pintarLab(); };
$('#labGuardar').onclick = () => {
  const gratis = !vivos().length; if (!gratis && est.monedas < COSTO) return aviso('No te alcanzan las monedas: gana combates o apuestas.');
  if (vivos().length >= 12) return aviso('El establo está lleno (12). Libera alguna quimera.');
  if (!gratis) est.monedas -= COSTO;
  const c = S.nuevaCriatura(est, lab.partes, lab.temp, 'tú'); c.apodo = $('#labApodo').value.trim().slice(0, 18); est.establo.push(c);
  est.cronica.unshift({ j: est.jornada, tipo: 'nace', texto: `Nace en tu establo ${S.nombreDe(c)} (${TEMPERAMENTOS[c.temp].nom.toLowerCase()}).` });
  guardar(); aviso(`¡${S.nombreDe(c)} entra a tu establo!`); $('#labApodo').value = '';
  lab.partes = S.partesAzar(Math.random); armarPreview(); pintarLab();
};

// ---------------------------------------------------------------- establo
let verCria = null;
function htmlCria(c, completo = false) {
  const e = S.estadisticas(c);
  return `<div class="cria ${verCria === c.id ? 'sel' : ''}"><div class="top"><b>${esc(S.nombreDe(c))}</b><span style="font-size:11px">nv ${c.nivel}</span></div>
    <div class="meta">${TEMPERAMENTOS[c.temp].nom} · ${c.v}-${c.d} (${c.kos} KO) · fama ${c.fama} · nació en la jornada ${c.nacio}</div>
    ${htmlBarra('XP', c.xp, xpPara(c.nivel))}
    <div class="tags">${c.tecnicas.map((t) => `<i class="t" title="${TECNICAS[t].desc}">${TECNICAS[t].nom}</i>`).join('')}${c.heridas.map((h) => `<i class="h">🩹 ${HERIDAS[h.tipo].nom} (${h.restan} j)</i>`).join('')}${c.cicatrices.map((h) => `<i class="c">cicatriz: ${HERIDAS[h].nom.toLowerCase()}</i>`).join('')}</div>
    <div style="font-size:11px;opacity:.7">${RANURAS.map((r) => nomParte(r, c.partes[r])).filter((n) => !/^Ningun/.test(n)).join(' · ')}</div>
    ${completo ? `<h5>Estadísticas</h5>${htmlStats(e)}<h5>Habilidades</h5>${htmlHabs(e)}` : ''}
    ${c.dueno === 'tú' ? `<div class="acc"><button data-ver="${c.id}">${verCria === c.id ? 'Ocultar' : 'Ver ficha'}</button><button data-ren="${c.id}">Renombrar</button>${c.heridas.length ? `<button data-cur="${c.id}">Curandero (−20 🪙)</button>` : ''}<button data-lib="${c.id}">Liberar</button></div>` : ''}</div>`;
}
function pintarEstablo() {
  const v = vivos();
  pintarSi($('#pEstablo'), `<div class="cab"><b>Tu establo (${v.length}/12) · ${est.monedas} 🪙</b><button data-cerrar>×</button></div>${v.map((c) => htmlCria(c, verCria === c.id)).join('') || '<div class="vacio">Vacío. Crea una quimera en el 🧪 Laboratorio (la primera es gratis).</div>'}
    <h5>Rivales de la arena</h5>${rivalesVivos().sort((a, b) => b.fama - a.fama).map((c) => `<div class="cria"><div class="top"><b>${esc(corto(c))}</b><span style="font-size:11px">nv ${c.nivel}</span></div><div class="meta">de ${esc(c.dueno)} · ${TEMPERAMENTOS[c.temp].nom} · ${c.v}-${c.d} · fama ${c.fama}${c.heridas.length ? ' · 🩹 herido' : ''}</div></div>`).join('')}`);
}
$('#pEstablo').addEventListener('click', (e) => {
  const t = e.target.closest('button'); if (!t) return; const d = t.dataset, c = S.buscar(est, +(d.ver || d.ren || d.cur || d.lib));
  if (d.ver) verCria = verCria === c.id ? null : c.id;
  if (d.ren) { const n = prompt('Nuevo apodo para ' + c.nombre, c.apodo || ''); if (n != null) { c.apodo = n.trim().slice(0, 18); guardar(); } }
  if (d.cur) { if (est.monedas < 20) return aviso('No te alcanza: el curandero cobra 20 🪙.'); est.monedas -= 20; const h = c.heridas.shift(); aviso(`${corto(c)} sanó de ${HERIDAS[h.tipo].nom.toLowerCase()}.`); guardar(); }
  if (d.lib && confirm(`¿Liberar a ${S.nombreDe(c)}? Se va para siempre.`)) { est.establo = est.establo.filter((x) => x !== c); est.cronica.unshift({ j: est.jornada, tipo: 'nace', texto: `Liberaste a ${S.nombreDe(c)} (${c.v}-${c.d}).` }); guardar(); if (!combate) modoReposo(); }
  pintarEstablo();
});

// ---------------------------------------------------------------- crónica
function pintarCronica() {
  const camp = est.cronica.filter((x) => x.tipo === 'campeon');
  pintarSi($('#pCronica'), `<div class="cab"><b>Crónica del coliseo</b><button data-cerrar>×</button></div>
    <h5>Campeones</h5>${camp.length ? htmlDiario(camp.map((x) => ({ texto: x.texto, d: 'J' + x.j, tipo: 'logro' })), 20) : '<div class="vacio">Aún no hay campeones. Organiza un 🏆 torneo.</div>'}
    <h5>Salón de los caídos</h5>${est.caidos.length ? htmlDiario(est.caidos.map((x) => ({ texto: `${x.nombre} (nv ${x.nivel}, ${x.v}-${x.d}, de ${x.dueno}) · lo mató ${x.por}`, d: 'J' + x.j, tipo: x.dueno === 'tú' ? 'malo' : '' })), 30) : '<div class="vacio">Nadie ha muerto todavía.</div>'}
    <h5>Historial de combates</h5>${htmlDiario(est.historial.map((h) => ({ texto: `${h.g ? h.b : h.a} venció a ${h.g ? h.a : h.b} ${{ ko: 'por KO', rendicion: 'por rendición', tiempo: 'por puntos' }[h.m]} (${h.t} s · ${h.tipo})${h.murio ? ' ☠' : ''}`, d: 'J' + h.j })), 30)}
    <h5>Noticias</h5>${htmlDiario(est.cronica.filter((x) => x.tipo !== 'campeon').map((x) => ({ texto: x.texto, d: 'J' + x.j, tipo: x.tipo === 'muerte' ? 'malo' : x.tipo === 'nace' ? 'bueno' : '' })), 40)}`);
}

// ---------------------------------------------------------------- menú «⋯»
function pintarMas() {
  pintarSi($('#pMas'), `<div class="ops">
    <button data-m="establo">🐾 Establo</button><button data-m="cronica">📜 Crónica</button>
    <button data-m="cine">🎥 Cámara de cine: ${est.opc.cine ? 'sí' : 'no'}</button>
    <button data-m="muerte">☠ Muerte permanente: ${est.opc.muerte ? 'sí' : 'no'}<small>En combates oficiales y torneos</small></button>
    <button data-m="ficha">📋 Ficha de luchadores</button><button data-m="diario">🗒 Diario de la pelea</button>
    <button data-m="hd">🖥 Calidad de imagen (recarga)</button>
    <button data-m="reset">↺ Empezar de cero</button></div>`);
}
$('#pMas').addEventListener('click', (e) => {
  const m = e.target.closest('[data-m]')?.dataset.m; if (!m) return;
  if (m === 'establo' || m === 'cronica') return abrirPanel(m);
  if (m === 'cine') { est.opc.cine = !est.opc.cine; guardar(); }
  if (m === 'muerte') { est.opc.muerte = !est.opc.muerte; guardar(); }
  if (m === 'ficha') { document.body.classList.toggle('verFicha'); document.body.classList.remove('verDiario'); }
  if (m === 'diario') { document.body.classList.toggle('verDiario'); document.body.classList.remove('verFicha'); }
  if (m === 'hd') { const b = document.createElement('div'); botonCalidad(b, guardar); b.firstChild.click(); }
  if (m === 'reset' && confirm('¿Borrar tu establo, tu crónica y empezar de cero?')) { est = S.estadoInicial((Date.now() % 1e9) | 0); est.caidos = []; guardar(); location.reload(); }
  pintarMas();
});

// ---------------------------------------------------------------- HUD, fichas y etiquetas
function pintarHud() {
  const h = $('#hud');
  if (!combate) { h.className = 'hud idle'; pintarSi(h, `<span>Jornada <b>${est.jornada}</b></span><span><b>${est.monedas}</b> 🪙</span><span>Establo <b>${vivos().length}</b></span>${est.torneo ? '<span>🏆 torneo en curso</span>' : ''}`); return; }
  h.className = 'hud';
  const lado = (L, cls) => `<div class="lado ${cls}"><b>${esc(L.nom)}</b><small>nv ${L.cr.nivel} · ${TEMPERAMENTOS[L.temp].nom.toLowerCase()} · ${L.cr.dueno === 'tú' ? 'tuya' : esc(L.cr.dueno)}</small><u><i style="width:${Math.max(0, L.hp / L.max * 100).toFixed(1)}%;background-position:${(100 - Math.max(0, L.hp / L.max) * 100).toFixed(0)}% 0"></i></u><div class="st">${iconos(L)}</div></div>`;
  pintarSi(h, `${lado(combate.L[0], 'a')}<div class="vs">VS<small>${fmtT(combate.t)}</small></div>${lado(combate.L[1], 'b')}`);
}
function pintarCols() {
  if (!combate) { $('#colIzq').classList.add('off'); $('#colDer').classList.add('off'); return; }
  pintarSi($('#colIzq'), combate.L.map((L) => `<div class="card"><h4>${esc(L.nom)}</h4><div class="grid"><span>Vida</span><b>${Math.max(0, Math.round(L.hp))} / ${Math.round(L.max)}</b><span>Daño hecho</span><b>${Math.round(L.hecho)}</b><span>Críticos · esquivas</span><b>${L.crits} · ${L.esq}</b></div>${htmlStats(L.e)}<div class="habs" style="margin-top:4px">${L.e.activas.filter((h) => h !== 'golpe').map((h) => `<div><b>${HAB[h].nom}</b> <span>${(L.cd[h] || 0) > 0 ? `recarga ${Math.ceil(L.cd[h])} s` : 'lista'}</span></div>`).join('')}</div></div>`).join(''));
  pintarSi($('#diario'), htmlDiario(diario, 40));
}
let tPint = 0;
const _p = new THREE.Vector3();
function moverEtiquetas() {
  actores.forEach((a, i) => {
    if (!a.etq) return; const L = combate?.L[i];
    _p.set(a.M.g.position.x, a.M.alto + a.M.alt + 0.4, a.M.g.position.z); const p = O.proyectar(_p);
    a.etq.style.display = p.visible ? '' : 'none'; a.etq.style.left = p.x + 'px'; a.etq.style.top = p.y + 'px';
    if (L) { const k = Math.max(0, L.hp / L.max); pintarSi(a.etq, `${esc(L.nom)}<u><i class="${k < 0.25 ? 'low' : k < 0.5 ? 'mid' : ''}" style="width:${(k * 100).toFixed(0)}%"></i></u><div class="st">${iconos(L)}</div>`); }
    else pintarSi(a.etq, `${esc(corto(a.cr))}${a.cr.heridas.length ? ' 🩹' : ''}`);
  });
}

// ---------------------------------------------------------------- bucle
let tGuardar = 0;
O.cada((dt, t) => {
  if (lento > 0 && mult) lento -= dt;
  const d = dt * mult * (lento > 0 ? 0.18 : 1); tAnim += d;
  camara(dt);
  if (combate) {
    // el público corea al favorito de vez en cuando (y salta al compás)
    if (!combate.fin && mult) { ctx.coroT -= d; if (ctx.coroT <= 0) { ctx.coroT = 10 + Math.random() * 8; const n = combate.L[ctx.fav].nom.split(" ").map(silabas).join(" "); locutor(`¡${n}! ¡${n}!`, 2600, true); coro = 2.6; } }
    // el combate en curso se guarda cada 2 s: si recargas, se reanuda en el mismo punto
    if (!combate.fin && (tGuardar += dt) > 2) { tGuardar = 0; if (est.enCurso) { est.enCurso.t = combate.t; guardar(); } }
    if (!combate.fin) S.pasoCombate(combate, d);
    for (const e of combate.ev) procesar(e); combate.ev.length = 0;
    combate.L.forEach((L, i) => {
      const a = actores[i]; if (!a) return; const g = a.M.g, k = Math.min(1, d * 12);
      g.position.x += (L.x - g.position.x) * k; g.position.z += (L.z - g.position.z) * k; g.rotation.y = angLerp(g.rotation.y, L.ang, Math.min(1, d * 10));
      animarModelo(a.M, { anim: L.anim, animT: L.animT, rap: L.rap, vuela: !!L.ef.vuelo, hab: L.hab, t: tAnim }, d);
    });
    if (combate.fin && !ctx.cerrado) { ctx.finT += d; if (ctx.finT > 2.6) cerrarCombate(); }
  } else {
    if (mult && !preview) { hora = (hora + d * 0.04) % 24; O.setHora(hora); }
    for (const a of actores) {
      if (a === preview) { a.ang += dt * 0.5; a.M.g.rotation.y = a.ang; animarModelo(a.M, { anim: 'quieto', t: tAnim + t }, dt); continue; }
      // paseo de reposo: elige un punto, camina, se detiene (si está herido va más lento)
      const vel = a.cr.heridas.length ? 0.7 : 1.5;
      if (!a.obj) { a.pausa -= d; if (a.pausa <= 0) { const r = Math.random() * (S.ARENA - 3), an = Math.random() * 6.28; a.obj = [Math.cos(an) * r, Math.sin(an) * r]; } a.rap = 0; }
      else { const dx = a.obj[0] - a.x, dz = a.obj[1] - a.z, dd = Math.hypot(dx, dz); if (dd < 0.3) { a.obj = null; a.pausa = 1 + Math.random() * 4; } else { a.x += dx / dd * vel * d; a.z += dz / dd * vel * d; a.ang = angLerp(a.ang, Math.atan2(dx, dz), Math.min(1, d * 4)); a.rap = vel; } }
      a.M.g.position.set(a.x, 0, a.z); a.M.g.rotation.y = a.ang; animarModelo(a.M, { anim: a.rap ? 'camina' : 'quieto', rap: a.rap, t: tAnim }, d);
    }
  }
  if (coro > 0) coro -= dt;
  AR.animar(d, tAnim, combate ? combate.emocion : 0.12, O.luz.noche, coro > 0 ? Math.min(1, coro) : 0);
  moverEtiquetas();
  tPint += dt; if (tPint > 0.2) { tPint = 0; pintarHud(); if (combate) pintarCols(); if (pTorneo.abierto) pintarTorneo(); }
});
O.alTocar((e) => { if (combate || preview) return; const id = O.tocar(e, actores.map((a) => a.M.g)); if (id != null) { verCria = id; abrirPanel('establo'); } });

modoReposo();
// un combate que quedó a medias: se reanuda; si ya no puede seguir, se devuelve la apuesta
if (est.enCurso) {
  const q = est.enCurso, a = S.buscar(est, q.a), b = S.buscar(est, q.b), T = est.torneo, p = T && S.peleaActual(T);
  const valido = a && b && a.viva && b.viva && (q.tipo !== 'torneo' || (p && p.a === q.a && p.b === q.b));
  if (valido) { setTimeout(() => aviso('Se reanuda el combate que dejaste a medias.'), 600); iniciarCombate(a, b, q.tipo, { apuesta: q.apuesta }, { semilla: q.semilla, t: q.t }); }
  else { if (q.apuesta) { est.monedas += q.apuesta.monto; aviso(`El combate pendiente ya no puede seguir: te devolvemos ${q.apuesta.monto} 🪙.`); } delete est.enCurso; guardar(); }
}
if (est.jornada === 1 && !est.historial.length) setTimeout(() => aviso('Bienvenido a la Arena de quimeras: ⚔ pelea, 🏆 organiza torneos o 🧪 crea tus propias quimeras.', 6000), 900);
setTimeout(() => { const l = $('#loader'); l.style.opacity = '0'; setTimeout(() => l.remove(), 700); }, 300);
window.est = () => est; window.O = O; window.combateActual = () => combate; // para depurar desde la consola
</script>
</body>
</html>
