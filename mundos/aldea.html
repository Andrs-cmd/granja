<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#15141a">
<title>La aldea</title>
<link rel="stylesheet" href="motor/ui.css">
<style>
  body { background: radial-gradient(ellipse at 50% 30%, #3b3a46 0%, #23222b 55%, #121117 100%); }
  .arriba { position: fixed; top: calc(8px + env(safe-area-inset-top)); left: 8px; right: 8px; z-index: 5; display: flex; gap: 6px; align-items: center; pointer-events: none; }
  .arriba > * { pointer-events: auto; }
  .pill { background: rgba(18,18,24,.82); border: 1px solid rgba(255,255,255,.14); border-radius: 99px; padding: 7px 12px; font-size: 13px; font-weight: 600; white-space: nowrap; color: inherit; text-decoration: none; }
  #titulo { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; text-align: center; }
  #espiritu { cursor: pointer; }
  /* lo que pasa en el orbe, en una línea: población, ciudades, lo que la sociedad debate */
  #estado { position: fixed; top: calc(50px + env(safe-area-inset-top)); left: 8px; right: 8px; z-index: 4; display: flex; gap: 4px; justify-content: center; flex-wrap: wrap; pointer-events: none; }
  #estado span { font-size: 11.5px; font-weight: 600; background: rgba(18,18,24,.7); border: 1px solid rgba(255,255,255,.1); border-radius: 99px; padding: 3px 9px; white-space: nowrap; }
  #estado span.deb { border-color: rgba(180,138,224,.6); max-width: 92vw; overflow: hidden; text-overflow: ellipsis; }
  .avisos { top: calc(84px + env(safe-area-inset-top)); }
  /* barra de abajo: velocidad del tiempo y los dones del espíritu */
  #dock { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(10px + env(safe-area-inset-bottom)); z-index: 6; display: flex; gap: 4px; align-items: center; background: rgba(20,19,27,.92); border: 1px solid rgba(255,255,255,.14); border-radius: 16px; padding: 6px; box-shadow: 0 8px 26px rgba(0,0,0,.45); max-width: calc(100vw - 16px); }
  #dock button { min-height: 38px; min-width: 36px; background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.12); border-radius: 10px; font-weight: 700; font-size: 12.5px; cursor: pointer; padding: 0 7px; color: inherit; }
  #dock button.on { background: rgba(231,196,106,.95); color: #1b1a17; border-color: transparent; }
  @media (max-width: 420px) { #dock { gap: 3px; padding: 5px; } #dock button { min-width: 30px; padding: 0 4px; font-size: 11.5px; } }
  #dock .sep { width: 1px; align-self: stretch; background: rgba(255,255,255,.12); margin: 0 2px; }
  #dock #bPoderes { background: rgba(180,138,224,.28); border-color: rgba(180,138,224,.6); }
  .hoja2 { position: fixed; left: 8px; right: 8px; bottom: calc(68px + env(safe-area-inset-bottom)); z-index: 7; max-height: min(62vh, 560px); overflow-y: auto; background: rgba(22,21,29,.97); border: 1px solid rgba(255,255,255,.14); border-radius: 16px; padding: 12px; box-shadow: 0 10px 30px rgba(0,0,0,.5); -webkit-overflow-scrolling: touch; overscroll-behavior: contain; font-size: 13px; }
  .hoja2.off { display: none; }
  @media (min-width: 900px) { .hoja2 { left: auto; right: 12px; top: 60px; bottom: 74px; width: 400px; max-height: none; } }
  .cab { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; } .cab b { color: #e7c46a; font-size: 14px; } .cab button { background: none; border: 0; font-size: 22px; cursor: pointer; color: inherit; line-height: 1; padding: 0 4px; }
  .dones { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .dones button { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 9px 4px 7px; border-radius: 12px; border: 1px solid rgba(255,255,255,.12); background: rgba(255,255,255,.05); color: inherit; cursor: pointer; font-weight: 700; font-size: 11.5px; text-align: center; line-height: 1.2; }
  .dones button em { font-style: normal; font-size: 24px; line-height: 1.1; } .dones button small { opacity: .7; font-weight: 600; font-size: 10.5px; }
  .dones.b button { border-color: rgba(124,195,106,.35); } .dones.c button { border-color: rgba(224,87,79,.4); }
  .dones button:disabled { opacity: .35; cursor: default; }
  #ficha { max-height: 46vh; }
  h3 { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: #e7c46a; margin: 14px 0 6px; font-weight: 700; } h3:first-child { margin-top: 2px; }
  .nota { font-size: 12px; opacity: .72; line-height: 1.45; margin: 4px 0; }
  .tarj { background: rgba(255,255,255,.045); border: 1px solid rgba(255,255,255,.08); border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; }
  .era { display: flex; gap: 10px; align-items: center; } .era em { font-size: 34px; font-style: normal; } .era b { font-size: 16px; display: block; }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 13px; } .kv span { opacity: .65; } .kv b { text-align: right; font-weight: 600; }
  .bar { display: grid; grid-template-columns: 112px 1fr 44px; gap: 8px; align-items: center; font-size: 12.5px; margin: 4px 0; }
  .bar u { height: 8px; border-radius: 4px; background: rgba(255,255,255,.1); overflow: hidden; text-decoration: none; position: relative; } .bar u i { position: absolute; top: 0; bottom: 0; left: 0; border-radius: 4px; }
  .bar em { font-style: normal; text-align: right; font-size: 12px; opacity: .85; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; } .chip { font-size: 11.5px; padding: 3px 8px; border-radius: 99px; background: rgba(255,255,255,.08); white-space: nowrap; } .chip.on { background: rgba(231,196,106,.3); }
  .pens { font-style: italic; background: rgba(231,196,106,.1); border-left: 3px solid #e7c46a; padding: 7px 10px; border-radius: 6px; margin: 8px 0 4px; font-size: 13px; }
  .acc { display: flex; gap: 6px; margin-top: 8px; } .acc .boton { flex: 1; min-height: 36px; }
  .linea { display: flex; gap: 4px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; } .linea div { flex: none; text-align: center; font-size: 11px; background: rgba(255,255,255,.05); border-radius: 8px; padding: 5px 7px; opacity: .55; } .linea div.on { opacity: 1; background: rgba(231,196,106,.22); } .linea div.ya { opacity: .9; } .linea em { display: block; font-size: 18px; font-style: normal; }
  .fin { text-align: center; border-color: rgba(231,196,106,.5); } .fin em { font-size: 44px; font-style: normal; display: block; }
  .diario li.decision { border-color: #b48ae0; } .diario li.era { border-color: #6ac8e0; } .diario li.espiritu { border-color: #e0b0ff; } .diario li.mov { border-color: #e09a5a; }
  #menu { right: 12px; bottom: calc(68px + env(safe-area-inset-bottom)); width: min(270px, calc(100vw - 24px)); }
  .etq { transition: none; }
</style>
</head>
<body>
<div id="loader">LA ALDEA DESPIERTA…</div>
<div id="stage"></div>
<div class="arriba"><a class="pill" href="index.html">←</a><div class="pill" id="titulo">La aldea</div><div class="pill" id="espiritu" title="Influencia del espíritu del orbe">✨ <b id="infl">0</b></div></div>
<div id="estado"></div>
<div class="etq" id="etq" style="display:none"></div>
<div class="panel off" id="menu"><div class="ops" id="menuOps"></div></div>
<section class="hoja2 off" id="poderes"></section>
<section class="hoja2 off" id="ficha"></section>
<section class="hoja2 off" id="cronica"></section>
<nav id="dock"></nav>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/" } }</script>
<script type="module">
// La aldea se gobierna sola: la gente piensa, vota, construye, inventa, pelea y elige su destino.
// Tú eres el espíritu del orbe: solo miras, bendices o castigas.
import { crearOrbe, THREE } from './motor/orbe3d.js';
import { $, esc, barraVelocidades, botonCalidad, aviso, panel, pintarSi, htmlDiario, guardarJSON, cargarJSON } from './motor/ui.js';
import * as S from './aldea/sim.js';
import { crearEscenaAldea } from './aldea/escena.js';

const CLAVE = 'orbe-aldea', CLAVE_HIST = 'orbe-aldea-historia', MIN_POR_SEG = 2;   // ×1 = 2 minutos por segundo: se ve caminar a la gente
// ---------------------------------------------------------------- partida: cargar, migrar o empezar
let s = null, avisoInicial = null;
{
  const viejo = cargarJSON(CLAVE);
  if (viejo && viejo.version !== S.VERSION) { try { localStorage.setItem('orbe-aldea-v2', JSON.stringify(viejo)); } catch { /* sin espacio */ } avisoInicial = 'La aldea renace con el nuevo motor de eras. Tu aldea anterior quedó guardada aparte (orbe-aldea-v2).'; }
  s = S.cargar(viejo);
  if (!s) { s = S.crearAldea((Math.random() * 2 ** 32) >>> 0, 1, leerHistoria()); avisoInicial ||= 'Nace una tribu nueva. Ellos deciden su historia; tú eres el espíritu del orbe.'; }
  s.decision && (s.pausar = false);
}
function leerHistoria() { try { return JSON.parse(localStorage.getItem(CLAVE_HIST) || '[]'); } catch { return []; } }
const O = crearOrbe($('#stage'), { radio: 46, colorSuelo: 0x7fa35a, camara: { target: new THREE.Vector3(0, 2, 0), pos: new THREE.Vector3(30, 46, 66) } });
const E = crearEscenaAldea(O, s);
window.aldea = { get s() { return s; }, S, E, O };
let renaciendo = false;   // al cambiar de civilización no hay que volver a guardar la vieja encima
const guardar = () => { if (!renaciendo) guardarJSON(CLAVE, S.guardar(s)); };
addEventListener('pagehide', guardar);
document.addEventListener('visibilitychange', () => { if (document.hidden) guardar(); });
function nuevaCivilizacion() {
  const h = [...(s.historia || [])]; if (s.fin && s.resumenFin && !h.some((x) => x.semilla === s.semilla && x.anios === s.resumenFin.anios)) h.push({ ciclo: s.ciclo, tipo: s.resumenFin.tipo, n: s.resumenFin.n, i: s.resumenFin.i, anios: s.resumenFin.anios, era: s.era, semilla: s.semilla });
  try { localStorage.setItem(CLAVE_HIST, JSON.stringify(h.slice(-30))); } catch { /* */ }
  renaciendo = true;
  guardarJSON(CLAVE, S.guardar(S.crearAldea((Math.random() * 2 ** 32) >>> 0, 1, h.slice(-30)))); location.reload();
}
// el orbe un poco más arriba en el celular para que la barra no lo tape
function encuadre() { const W = innerWidth, H = innerHeight; O.camera.setViewOffset(W, H, 0, W < 900 ? Math.min(40, H * 0.05) : 0, W, H); O.camera.updateProjectionMatrix(); }
addEventListener('resize', () => setTimeout(encuadre, 0));

// ---------------------------------------------------------------- barra de abajo
let mult = 1;
const dock = $('#dock');
const vel = barraVelocidades(dock, [['⏸', 0], ['×1', 1], ['×20', 20], ['×200', 200], ['×2k', 2000], ['×20k', 20000]], 'aldea-vel3', 3, (m) => { mult = m; });
const sepa = () => { const d = document.createElement('div'); d.className = 'sep'; dock.append(d); };
const btn = (txt, titulo, fn, id) => { const b = document.createElement('button'); b.textContent = txt; b.title = titulo; if (id) b.id = id; b.onclick = fn; dock.append(b); return b; };
sepa();
const hojas = { poderes: $('#poderes'), ficha: $('#ficha'), cronica: $('#cronica') };
function abrir(k) { for (const [n, el] of Object.entries(hojas)) el.classList.toggle('off', n !== k || !el.classList.contains('off')); menuP.cerrar(); pintar(true); }
const cerrarHojas = () => { for (const el of Object.values(hojas)) el.classList.add('off'); };
btn('✨', 'Poderes del espíritu: bendiciones y catástrofes', () => abrir('poderes'), 'bPoderes');
btn('📜', 'Crónica del orbe', () => abrir('cronica'));
const menuP = panel($('#menu'));
btn('⋯', 'Más', () => { cerrarHojas(); menuP.alternar(); });
{ const ops = $('#menuOps'), op = (t, sub, fn) => { const b = document.createElement('button'); b.innerHTML = `${t}<small>${sub}</small>`; b.onclick = () => { menuP.cerrar(); fn(); }; ops.append(b); };
  op('🎥 Vista general', 'Dejar de seguir y ver todo el orbe', () => { seguir(null); O.volar(new THREE.Vector3(0, 2, 0), 110); });
  op('🌱 Nueva civilización', 'Otra semilla, otra historia (la actual queda en la historia del orbe)', () => { if (confirm('¿Empezar una civilización nueva?')) nuevaCivilizacion(); });
  const hd = document.createElement('div'); ops.append(hd); botonCalidad(hd, guardar).className = 'op'; }
$('#espiritu').onclick = () => abrir('poderes');
for (const el of Object.values(hojas)) el.addEventListener('click', (e) => { if (e.target.closest('[data-cerrar]')) { el.classList.add('off'); if (el === hojas.ficha) elegir(null); } });

// ---------------------------------------------------------------- elegir y seguir gente
let selId = null, siguiendo = false;
function elegir(id) { selId = id; E.elegir(id); if (id == null && siguiendo) { O.seguir(null); siguiendo = false; } }
function seguir(id) { if (id == null || (siguiendo && selId === id)) { O.seguir(null); siguiendo = false; } else { elegir(id); siguiendo = true; O.seguir(() => (S.vivo(s, id) ? E.posDe(id) : null), 14); } pintar(true); }
O.alTocar((ev) => {
  const id = E.personaEn(ev); if (id != null) { elegir(id); for (const k of ['poderes', 'cronica']) hojas[k].classList.add('off'); hojas.ficha.classList.remove('off'); pintar(true); return; }
  const c = E.celdaEn(ev); if (!c) return;
  const usos = S.USOS, viven = s.gente.filter((a) => a.hogar === c.k).length, trab = s.gente.filter((a) => a.trabajo === c.k).length;
  const t = c.u ? `${usos[c.u].n}${c.n > 1 ? ` · ${c.n} pisos` : ''} · estilo ${S.ERAS[c.e].n.toLowerCase()}${c.ru ? ' · EN RUINAS' : ''}` : c.o ? `En obra: ${usos[c.o.u].n} (${Math.round(c.o.p * 100)} %)` : { p: 'Pradera', b: 'Bosque', r: 'Roca', m: `Montaña (${c.h.toFixed(1)} m)`, a: 'Lago', v: 'Río', c: 'Cementerio' }[c.t];
  aviso(`${t}${viven ? ` · viven ${viven}` : ''}${trab ? ` · trabajan ${trab}` : ''}${c.cont > 0.15 ? ` · contaminación ${Math.round(c.cont * 100)} %` : ''}`);
});
document.addEventListener('click', (e) => {
  const t = e.target;
  if (t.closest('[data-seguir]')) seguir(+t.closest('[data-seguir]').dataset.seguir);
  const pw = t.closest('[data-poder]');
  if (pw) {
    const k = pw.dataset.poder, P = S.PODERES[k], r = S.usarPoder(s, k, k === 'inspirar' ? selId : null);
    aviso(r || `${P.i} ${P.n}`);
    if (!r && s.efecto && ['meteorito', 'terremoto', 'incendio', 'inundacion', 'rayo'].includes(k)) { seguir(null); O.volar(new THREE.Vector3(s.efecto.x, 2, s.efecto.z), k === 'terremoto' ? 80 : 60); hojas.poderes.classList.add('off'); }
    pintar(true);
  }
  if (t.closest('[data-nueva]')) nuevaCivilizacion();
});

// ---------------------------------------------------------------- pintar (solo mirar: aquí nadie decide por la gente)
const fmt = (n) => (n >= 1e6 ? `${(n / 1e6).toLocaleString('es-CO', { maximumFractionDigits: 1 })} M` : n >= 1e4 ? `${Math.round(n / 1e3)} mil` : Math.round(n).toLocaleString('es-CO'));
const pct = (x) => `${Math.round(x * 100)} %`;
const barra = (t, v, max = 100, c = '#e7c46a', txt = null) => `<div class="bar"><span>${t}</span><u><i style="width:${Math.max(0, Math.min(100, (v / max) * 100))}%;background:${c}"></i></u><em>${txt ?? Math.round(v)}</em></div>`;
const cab = (t) => `<div class="cab"><b>${t}</b><button data-cerrar aria-label="Cerrar">×</button></div>`;
let presionado = false; addEventListener('pointerdown', (e) => { if (e.target.closest('.hoja2')) presionado = true; }); addEventListener('pointerup', () => setTimeout(() => { presionado = false; }, 60));
function pintar(forzar = false) {
  const Er = S.ERAS[Math.min(8, s.era)];
  $('#titulo').textContent = `${Er.i} ${s.destino ? S.DESTINOS[s.destino.tipo].n : Er.n} · ${S.fechaTxt(s)}`;
  $('#infl').textContent = Math.floor(s.esp.influencia);
  pintarSi($('#estado'), htmlEstado());
  if (!forzar && presionado) return;
  if (!hojas.poderes.classList.contains('off')) pintarSi(hojas.poderes, htmlPoderes());
  if (!hojas.ficha.classList.contains('off')) pintarSi(hojas.ficha, htmlFicha());
  if (!hojas.cronica.classList.contains('off')) pintarSi(hojas.cronica, htmlCronica());
}
function htmlEstado() {
  const r = S.resumen(s), V = S.vivas(s), ev = [`👥 ${r.pob} · ${fmt(r.hab)} hab.`];
  if (V.length > 1) ev.push(`🏙 ${V.length} ciudades`);
  if (s.guerra) ev.push(`⚔ ${esc(s.ciudades[s.guerra.a].nombre)} vs ${esc(s.ciudades[s.guerra.b].nombre)}`);
  if (s.epidemia) ev.push('🤒 epidemia'); if (s.clima.sequia) ev.push('☀ sequía');
  if (s.mega) ev.push(`${S.DESTINOS[s.mega.k].i} ${pct(s.mega.prog)}`);
  let h = ev.map((x) => `<span>${x}</span>`).join('');
  if (s.decision) h += `<span class="deb">⚖ Debaten: ${esc(s.decision.t)}</span>`;
  if (s.fin && finEn) h += `<span class="deb">🌱 Una nueva tribu llega en ${Math.max(0, Math.ceil(finEn - performance.now() / 1000))} s</span>`;
  return h;
}
function htmlPoderes() {
  const inf = Math.floor(s.esp.influencia), grupo = (t) => Object.entries(S.PODERES).filter(([, P]) => P.t === t).map(([k, P]) => `<button data-poder="${k}" ${inf < P.costo ? 'disabled' : ''} title="${esc(P.d)}"><em>${P.i}</em>${esc(P.n)}<small>${'✨'.repeat(P.costo)}</small></button>`).join('');
  return cab(`✨ Espíritu del orbe · ${inf}/10`) + `<div class="nota">No gobiernas: la gente decide su historia. Tú solo bendices o castigas. La influencia vuelve con cada estación (más rápido si te tienen fe: ${Math.round(s.esp.fe)}).</div>
    <h3>Bendiciones</h3><div class="dones b">${grupo('b')}</div><h3>Catástrofes</h3><div class="dones c">${grupo('c')}</div>`;
}
function htmlFicha() {
  const a = selId != null && S.vivo(s, selId);
  if (!a) return cab('Persona') + '<div class="nota">Ya no está entre los vivos.</div>';
  const P = S.pensamiento(s, a), C = s.ciudades[a.al], voto = s.decision ? S.votoDe(s, a) : null;
  return cab(`${esc(a.nombre)} ${esc(a.apellido)}${C.lider === a.id ? ` · ${esc(S.cargoDe(s, a))}` : ''}`) + `<div class="nota">${Math.floor(a.edad)} años · ${esc(S.oficioDe(s, a))}${s.era > 0 ? ` · clase ${a.clase}` : ''} · ${esc(C.nombre)}</div><div class="nota">Es ${esc(S.MENTE.describir(a))}.</div>
    <div class="pens">💭 «${esc(P.txt)}»</div>${voto ? `<div class="nota">⚖ En «${esc(s.decision.t)}» apoya «${esc(voto.n)}» ${esc(voto.motivo)}.</div>` : ''}
    ${barra('Ánimo', a.animo, 100, a.animo > 50 ? '#7cc36a' : '#e07a5a')}${barra('Salud', a.salud, 100, '#7cc36a')}
    <div class="acc"><button class="boton" data-seguir="${a.id}">${siguiendo && selId === a.id ? '◉ Siguiendo' : '◎ Seguir'}</button><button class="boton" data-poder="inspirar" ${s.esp.influencia < 1 ? 'disabled' : ''}>✨ Inspirar</button></div>
    <h3>Su vida</h3><ul class="diario">${a.vida.slice(0, 6).map((v) => `<li><span class="d">${esc(v.d)}</span>${esc(v.texto)}</li>`).join('')}</ul>`;
}
function htmlFin() {
  if (!s.fin || !s.resumenFin) return '';
  const R = s.resumenFin, X = S.DESTINOS[R.tipo];
  return `<div class="tarj fin"><em>${R.i}</em><b style="font-size:17px">${esc(R.n)}</b><p class="nota">${X?.d ? esc(X.d) : 'No quedó nadie en el orbe.'}${R.causa ? ` Causa: ${esc(S.CAUSAS[R.causa].n.toLowerCase())}.` : ''}</p><div class="kv"><span>Duró</span><b>${R.anios} años</b><span>Era alcanzada</span><b>${S.ERAS[Math.min(8, R.era)].i} ${S.ERAS[Math.min(8, R.era)].n}</b><span>Población máxima</span><b>${R.maxPob} ciudadanos</b></div><button class="boton prim" style="width:100%;margin-top:8px;min-height:40px" data-nueva>🌱 Nueva civilización ya</button></div>`;
}
function htmlCronica() {
  const Er = S.ERAS[Math.min(8, s.era)], C = s.ciudades.find((x) => !x.vacia) || s.ciudades[0], r = S.resumen(s), L = S.vivo(s, C.lider), prob = S.destinoProbable(s);
  const linea = S.ERAS.slice(0, 8).map((E0, i) => { const ya = s.eras.filter((x) => x.era === i).pop(); return `<div class="${i === s.era && !s.destino ? 'on' : ya ? 'ya' : ''}"><em>${E0.i}</em>${esc(E0.n.replace('Era ', '').replace('de la ', ''))}<br><small>${ya ? `año ${ya.anio}` : '—'}</small></div>`; }).join('');
  return cab('📜 Crónica del orbe') + htmlFin() + `<div class="tarj era"><em>${Er.i}</em><div><b>${s.destino ? S.DESTINOS[s.destino.tipo].i + ' ' + S.DESTINOS[s.destino.tipo].n : Er.n}</b><span class="nota">${esc(Er.d)}</span></div></div>
    <div class="kv"><span>Ciudadanos · habitantes</span><b>${r.pob} · ${fmt(r.hab)}</b><span>Gobierno</span><b>${S.GOBIERNOS[s.gobierno].n}</b><span>Al mando</span><b>${L ? `${esc(L.nombre)}, ${esc(S.cargoDe(s, L))}` : '—'}</b><span>Ánimo · salud · estudio</span><b>${r.animo} · ${r.salud} · ${r.edu}</b><span>Ecología · contaminación</span><b>${s.ecologia} · ${pct(s.contaminacion)}</b></div>
    <h3>Línea del tiempo</h3><div class="linea">${linea}</div>
    <h3>Hacia dónde va</h3><div class="chips">${prob.map((p, i) => `<span class="chip ${i === 0 ? 'on' : ''}">${S.DESTINOS[p.k].i} ${S.DESTINOS[p.k].n}</span>`).join('')}</div>
    ${s.decision ? `<h3>⚖ Lo que debaten ahora</h3><div class="nota"><b>${esc(s.decision.t)}</b>: ${esc(s.decision.q)}</div>` : ''}
    <h3>Lo que la sociedad decidió</h3>${s.decisiones.slice().reverse().slice(0, 12).map((d) => `<div class="nota">A${d.anio} · <b>${esc(d.t)}</b>: «${esc(d.n)}» (${d.pct} %)</div>`).join('') || '<div class="nota">Todavía nada.</div>'}
    <h3>Hitos</h3><ul class="diario">${s.hitos.slice(0, 30).map((x) => `<li class="${x.tipo}"><span class="d">${esc(x.d)}</span>${esc(x.texto)}</li>`).join('')}</ul>
    <h3>Diario</h3>${htmlDiario(s.diario, 25)}`;
}

// ---------------------------------------------------------------- avisos, etiqueta y bucle
let visto = s.diario[0];
function avisosNuevos() {
  const nuevos = []; for (const x of s.diario) { if (x === visto) break; nuevos.push(x); } visto = s.diario[0];
  for (const x of nuevos.filter((x) => ['logro', 'malo', 'decision', 'era', 'espiritu'].includes(x.tipo)).slice(0, 2).reverse()) aviso(x.texto, 4200);
}
const etq = $('#etq');
function etiqueta() {
  const a = selId != null && S.vivo(s, selId), p = a && !E.estaDentro(selId) && E.posDe(selId);
  if (!p) { etq.style.display = 'none'; return; }
  const q = O.proyectar(p.add(new THREE.Vector3(0, 1.4, 0)));
  etq.style.display = q.visible ? '' : 'none'; etq.style.left = q.x + 'px'; etq.style.top = q.y + 'px'; etq.textContent = a.nombre;
}
let tUI = 0, tGuardar = 0, finEn = 0;
O.cada((dt) => {
  s.pausar = false;   // nadie espera al jugador
  if (mult) S.avanzar(s, dt * mult * MIN_POR_SEG, 40);
  // cuando una civilización termina, tras un rato llega otra tribu (el orbe nunca se queda quieto)
  if (s.fin && !finEn) { finEn = performance.now() / 1000 + 40; aviso('La historia de esta civilización terminó. Pronto llegará otra tribu.', 6000); }
  if (finEn && performance.now() / 1000 > finEn) { finEn = 0; nuevaCivilizacion(); }
  O.setHora(S.horaDe(s), { nublado: Math.min(0.85, (s.clima.lluvia ? 0.6 : 0) + s.contaminacion * 0.8) });
  E.actualizar(s, dt, mult);
  etiqueta();
  tUI += dt; if (tUI > 0.5) { tUI = 0; pintar(); avisosNuevos(); }
  tGuardar += dt; if (tGuardar > 20) { tGuardar = 0; guardar(); }
});
pintar(true); encuadre();
$('#loader').style.opacity = '0'; setTimeout(() => $('#loader').remove(), 700);
if (avisoInicial) aviso(avisoInicial, 6000);
</script>
