<!doctype html>
<html lang="es">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#15141a">
<title>La aldea</title>
<link rel="stylesheet" href="motor/ui.css">
<style>
  body { background: radial-gradient(ellipse at 50% 30%, #3b3a46 0%, #23222b 55%, #121117 100%); }
  .arriba { position: fixed; top: calc(8px + env(safe-area-inset-top)); left: 8px; right: 8px; z-index: 5; display: flex; gap: 6px; align-items: center; pointer-events: none; }
  .arriba > * { pointer-events: auto; }
  .pill { background: rgba(18,18,24,.82); border: 1px solid rgba(255,255,255,.14); border-radius: 99px; padding: 7px 12px; font-size: 13px; font-weight: 600; white-space: nowrap; color: inherit; text-decoration: none; }
  #titulo { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; text-align: center; }
  #espiritu { cursor: pointer; }
  #hoja { position: fixed; left: 0; right: 0; bottom: 0; height: var(--h, 150px); z-index: 6; display: flex; flex-direction: column; background: rgba(20,19,27,.97); border-top: 1px solid rgba(255,255,255,.14); border-radius: 18px 18px 0 0; box-shadow: 0 -10px 30px rgba(0,0,0,.4); transition: height .28s ease; padding-bottom: env(safe-area-inset-bottom); }
  #hoja.arrastrando { transition: none; }
  .asa { height: 22px; flex: none; display: grid; place-items: center; cursor: grab; touch-action: none; } .asa::before { content: ''; width: 44px; height: 5px; border-radius: 3px; background: rgba(255,255,255,.3); }
  .controles { display: flex; gap: 4px; align-items: center; padding: 0 10px 6px; flex: none; }
  .controles button { min-height: 36px; min-width: 36px; background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.12); border-radius: 10px; font-weight: 700; font-size: 12.5px; cursor: pointer; padding: 0 8px; }
  .controles button.on { background: rgba(231,196,106,.95); color: #1b1a17; border-color: transparent; }
  .controles .sep { flex: 1; }
  .pestanas { display: flex; flex: none; border-bottom: 1px solid rgba(255,255,255,.1); }
  .pestanas button { flex: 1; min-height: 46px; background: none; border: 0; border-bottom: 3px solid transparent; font-size: 11.5px; font-weight: 700; cursor: pointer; opacity: .7; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; padding: 2px 0; position: relative; }
  .pestanas button span { font-size: 17px; line-height: 1; } .pestanas button.on { opacity: 1; border-bottom-color: #e7c46a; color: #f5e3a8; }
  .pestanas .badge { position: absolute; top: 4px; right: calc(50% - 20px); font-size: 10px; background: #e0574f; color: #fff; border-radius: 99px; padding: 0 5px; }
  #cuerpo { flex: 1; overflow-y: auto; padding: 12px 12px 18px; font-size: 13.5px; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
  @media (min-width: 900px) {
    #hoja { left: auto; right: 12px; top: 12px; bottom: 12px; width: 420px; height: auto !important; border-radius: 16px; border: 1px solid rgba(255,255,255,.14); }
    .asa { display: none; } .controles { padding-top: 10px; } .arriba { right: 444px; }
  }
  h3 { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: #e7c46a; margin: 14px 0 6px; font-weight: 700; } h3:first-child { margin-top: 2px; }
  .nota { font-size: 12px; opacity: .72; line-height: 1.45; margin: 4px 0; }
  .tarj { background: rgba(255,255,255,.045); border: 1px solid rgba(255,255,255,.08); border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; }
  .era { display: flex; gap: 10px; align-items: center; } .era em { font-size: 34px; font-style: normal; } .era b { font-size: 16px; display: block; }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 13px; } .kv span { opacity: .65; } .kv b { text-align: right; font-weight: 600; }
  .bar { display: grid; grid-template-columns: 112px 1fr 44px; gap: 8px; align-items: center; font-size: 12.5px; margin: 4px 0; }
  .bar u { height: 8px; border-radius: 4px; background: rgba(255,255,255,.1); overflow: hidden; text-decoration: none; position: relative; } .bar u i { position: absolute; top: 0; bottom: 0; left: 0; border-radius: 4px; background: var(--c, #e7c46a); }
  .bar em { font-style: normal; text-align: right; font-size: 12px; opacity: .85; }
  .eje { margin: 8px 0 10px; } .eje .ext { display: flex; justify-content: space-between; font-size: 12px; font-weight: 700; } .eje u { display: block; position: relative; height: 10px; border-radius: 5px; background: linear-gradient(90deg, var(--a), rgba(255,255,255,.08) 50%, var(--b)); margin: 3px 0; text-decoration: none; }
  .eje u b { position: absolute; top: -4px; width: 4px; height: 18px; border-radius: 2px; background: #fff; box-shadow: 0 0 6px #fff; transform: translateX(-50%); } .eje small { font-size: 11.5px; opacity: .7; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; } .chip { font-size: 11.5px; padding: 3px 8px; border-radius: 99px; background: rgba(255,255,255,.08); white-space: nowrap; } .chip.on { background: rgba(231,196,106,.3); } .chip.f { background: rgba(180,138,224,.25); } button.chip { border: 0; cursor: pointer; color: inherit; }
  .op { display: block; width: 100%; text-align: left; background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.12); border-radius: 12px; padding: 10px; margin-bottom: 8px; }
  .op b { font-size: 14px; } .op p { font-size: 12px; opacity: .78; margin: 3px 0 6px; } .op .ejes2 { font-size: 11.5px; opacity: .85; }
  .op .voto { height: 7px; border-radius: 4px; background: rgba(255,255,255,.1); overflow: hidden; margin: 6px 0; } .op .voto i { display: block; height: 100%; background: #e7c46a; }
  .op .acc { display: flex; gap: 6px; } .op .acc button { flex: 1; min-height: 34px; border-radius: 9px; border: 1px solid rgba(180,138,224,.5); background: rgba(180,138,224,.16); color: inherit; font-weight: 700; font-size: 12px; cursor: pointer; }
  .op .acc button:disabled { opacity: .35; cursor: default; }
  .gente { display: grid; gap: 4px; } .gente button { display: grid; grid-template-columns: 1fr auto; gap: 1px 8px; text-align: left; background: rgba(255,255,255,.045); border: 1px solid rgba(255,255,255,.08); border-radius: 10px; padding: 6px 9px; cursor: pointer; color: inherit; font-size: 12.5px; } .gente button small { grid-column: 1 / -1; opacity: .65; font-size: 11.5px; }
  .pens { font-style: italic; background: rgba(231,196,106,.1); border-left: 3px solid #e7c46a; padding: 7px 10px; border-radius: 6px; margin: 8px 0 4px; font-size: 13px; }
  .interno { font-size: 12px; opacity: .78; margin: 2px 0 2px 12px; font-style: italic; }
  .opi { display: grid; grid-template-columns: 92px 1fr; gap: 2px 8px; align-items: center; font-size: 12px; margin: 5px 0; } .opi u { position: relative; height: 8px; border-radius: 4px; background: rgba(255,255,255,.1); text-decoration: none; } .opi u i { position: absolute; top: 0; bottom: 0; border-radius: 4px; } .opi u::after { content: ''; position: absolute; left: 50%; top: -2px; bottom: -2px; width: 1px; background: rgba(255,255,255,.4); } .opi small { grid-column: 2; opacity: .62; font-size: 11px; }
  .lnk { background: none; border: 0; color: #e7c46a; cursor: pointer; font: inherit; font-weight: 700; padding: 0; text-decoration: underline dotted; }
  .linea { display: flex; gap: 4px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; } .linea div { flex: none; text-align: center; font-size: 11px; background: rgba(255,255,255,.05); border-radius: 8px; padding: 5px 7px; opacity: .55; } .linea div.on { opacity: 1; background: rgba(231,196,106,.22); } .linea div.ya { opacity: .9; } .linea em { display: block; font-size: 18px; font-style: normal; }
  .grafs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; } .grafs span { font-size: 11.5px; opacity: .8; display: flex; justify-content: space-between; } @media (max-width: 420px) { .grafs { grid-template-columns: 1fr; } }
  .fin { text-align: center; border-color: rgba(231,196,106,.5); } .fin em { font-size: 44px; font-style: normal; display: block; } .fin .boton { margin-top: 8px; width: 100%; min-height: 42px; }
  .tabsm { display: flex; gap: 4px; margin-bottom: 8px; } .tabsm button { flex: 1; min-height: 32px; border-radius: 9px; border: 1px solid rgba(255,255,255,.12); background: rgba(255,255,255,.05); color: inherit; font-weight: 700; font-size: 12px; cursor: pointer; } .tabsm button.on { background: #e7c46a; color: #1b1a17; }
  .diario li.decision { border-color: #b48ae0; } .diario li.era { border-color: #6ac8e0; } .diario li.espiritu { border-color: #e0b0ff; } .diario li.mov { border-color: #e09a5a; }
  #menu { right: 12px; bottom: calc(160px + env(safe-area-inset-bottom)); width: min(270px, calc(100vw - 24px)); } @media (min-width: 900px) { #menu { right: 444px; bottom: 20px; } }
  .etq { transition: none; }
</style>
</head>
<body>
<div id="loader">LA ALDEA DESPIERTA…</div>
<div id="stage"></div>
<div class="arriba"><a class="pill" href="index.html">←</a><div class="pill" id="titulo">La aldea</div><div class="pill" id="espiritu" title="Influencia del espíritu del orbe">✨ <b id="infl">0</b></div></div>
<div class="etq" id="etq" style="display:none"></div>
<div class="panel off" id="menu"><div class="ops" id="menuOps"></div></div>
<section id="hoja">
  <div class="asa" id="asa"></div>
  <div class="controles" id="controles"></div>
  <nav class="pestanas" id="pestanas"></nav>
  <div id="cuerpo"></div>
</section>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/" } }</script>
<script type="module">
import { crearOrbe, THREE } from './motor/orbe3d.js';
import { $, esc, barraVelocidades, botonCalidad, aviso, panel, pintarSi, htmlDiario, htmlGrafica, guardarJSON, cargarJSON } from './motor/ui.js';
import * as S from './aldea/sim.js';
import { crearEscenaAldea } from './aldea/escena.js';

const M = S.MENTE, U = S.CIUDAD;
const CLAVE = 'orbe-aldea', CLAVE_HIST = 'orbe-aldea-historia', MIN_POR_SEG = 2;   // ×1 = 2 minutos por segundo: se ve caminar a la gente
const escritorio = () => innerWidth >= 900;
// ---------------------------------------------------------------- partida: cargar, migrar o empezar
let s = null, avisoInicial = null;
{
  const viejo = cargarJSON(CLAVE);
  if (viejo && viejo.version !== S.VERSION) { try { localStorage.setItem('orbe-aldea-v2', JSON.stringify(viejo)); } catch { /* sin espacio */ } avisoInicial = 'La aldea renace con el nuevo motor de eras. Tu aldea anterior quedó guardada aparte (orbe-aldea-v2).'; }
  s = S.cargar(viejo);
  if (!s) { s = S.crearAldea((Math.random() * 2 ** 32) >>> 0, 1, leerHistoria()); avisoInicial ||= 'Nace una tribu nueva. Mírala crecer… y decide con ella.'; }
}
function leerHistoria() { try { return JSON.parse(localStorage.getItem(CLAVE_HIST) || '[]'); } catch { return []; } }
const O = crearOrbe($('#stage'), { radio: 46, colorSuelo: 0x7fa35a, camara: { target: new THREE.Vector3(0, 2, 0), pos: new THREE.Vector3(30, 46, 66) } });
const E = crearEscenaAldea(O, s);
window.aldea = { get s() { return s; }, S, E, O };
const guardar = () => guardarJSON(CLAVE, S.guardar(s));
addEventListener('pagehide', guardar);
document.addEventListener('visibilitychange', () => { if (document.hidden) guardar(); });
function nuevaCivilizacion() {
  const h = [...(s.historia || [])]; if (s.fin && s.resumenFin && !h.some((x) => x.semilla === s.semilla && x.anios === s.resumenFin.anios)) h.push({ ciclo: s.ciclo, tipo: s.resumenFin.tipo, n: s.resumenFin.n, i: s.resumenFin.i, anios: s.resumenFin.anios, era: s.era, semilla: s.semilla });
  try { localStorage.setItem(CLAVE_HIST, JSON.stringify(h.slice(-30))); } catch { /* */ }
  guardarJSON(CLAVE, S.crearAldea((Math.random() * 2 ** 32) >>> 0, 1, h.slice(-30))); location.reload();
}

// ---------------------------------------------------------------- la hoja (abajo en celular, a la derecha en escritorio)
const hoja = $('#hoja'), ALTOS = () => [150, Math.round(innerHeight * 0.5), Math.round(innerHeight * 0.86)];
let nivelHoja = 1;
function ponerHoja(n, anim = true) { nivelHoja = Math.max(0, Math.min(2, n)); hoja.classList.toggle('arrastrando', !anim); hoja.style.setProperty('--h', `${ALTOS()[nivelHoja]}px`); setTimeout(encuadre, anim ? 300 : 0); }
{ let y0 = null, h0 = 0; const asa = $('#asa');
  asa.addEventListener('pointerdown', (e) => { y0 = e.clientY; h0 = hoja.getBoundingClientRect().height; asa.setPointerCapture(e.pointerId); hoja.classList.add('arrastrando'); });
  asa.addEventListener('pointermove', (e) => { if (y0 == null) return; const h = Math.max(110, Math.min(innerHeight * 0.92, h0 + (y0 - e.clientY))); hoja.style.setProperty('--h', `${h}px`); });
  const soltar = (e) => { if (y0 == null) return; const dy = y0 - e.clientY, h = h0 + dy; y0 = null; hoja.classList.remove('arrastrando'); if (Math.abs(dy) < 6) return ponerHoja(nivelHoja === 0 ? 1 : nivelHoja === 1 ? 2 : 0); const A = ALTOS(); let m = 0; A.forEach((a, i) => { if (Math.abs(a - h) < Math.abs(A[m] - h)) m = i; }); ponerHoja(m); };
  asa.addEventListener('pointerup', soltar); asa.addEventListener('pointercancel', soltar); }
// el orbe se corre para quedar en el espacio libre (arriba de la hoja o a la izquierda del panel)
function encuadre() {
  const W = innerWidth, H = innerHeight;
  if (escritorio()) O.camera.setViewOffset(W, H, 215, 0, W, H);
  else { const h = hoja.getBoundingClientRect().height; O.camera.setViewOffset(W, H, 0, Math.min(h * 0.5, H * 0.34), W, H); }
  O.camera.updateProjectionMatrix();
}
addEventListener('resize', () => { if (!escritorio()) ponerHoja(nivelHoja, false); setTimeout(encuadre, 0); });
ponerHoja(1, false);

// ---------------------------------------------------------------- controles: velocidades, pausa en decisiones, menú
let mult = 1, pausaDecision = (() => { try { return localStorage.getItem('aldea-pausa') !== '0'; } catch { return true; } })();
const ctr = $('#controles');
const vel = barraVelocidades(ctr, [['⏸', 0], ['×1', 1], ['×20', 20], ['×200', 200], ['×2k', 2000], ['×20k', 20000]], 'aldea-vel3', 3, (m) => { mult = m; });
const sep = document.createElement('div'); sep.className = 'sep'; ctr.append(sep);
const bPausa = document.createElement('button'); bPausa.title = 'Pausar cuando la sociedad deba decidir'; ctr.append(bPausa);
const pintarPausa = () => { bPausa.textContent = pausaDecision ? '⚖⏸' : '⚖▶'; bPausa.classList.toggle('on', pausaDecision); };
bPausa.onclick = () => { pausaDecision = !pausaDecision; try { localStorage.setItem('aldea-pausa', pausaDecision ? '1' : '0'); } catch { /* */ } pintarPausa(); aviso(pausaDecision ? 'Se pausará cuando haya que decidir.' : 'Las decisiones no pausarán el tiempo.'); };
pintarPausa();
const menuP = panel($('#menu'));
const bMenu = document.createElement('button'); bMenu.textContent = '⋯'; bMenu.onclick = () => menuP.alternar(); ctr.append(bMenu);
{ const ops = $('#menuOps'), op = (t, sub, fn) => { const b = document.createElement('button'); b.innerHTML = `${t}<small>${sub}</small>`; b.onclick = () => { menuP.cerrar(); fn(); }; ops.append(b); };
  op('🎥 Vista general', 'Dejar de seguir y ver todo el orbe', () => { seguir(null); O.volar(new THREE.Vector3(0, 2, 0), 110); });
  op('🌱 Nueva civilización', 'Otra semilla, otra historia (la actual queda en la historia del orbe)', () => { if (confirm('¿Empezar una civilización nueva?')) nuevaCivilizacion(); });
  const hd = document.createElement('div'); ops.append(hd); botonCalidad(hd, guardar).className = 'op'; }
$('#espiritu').onclick = () => irA('destino');

// ---------------------------------------------------------------- pestañas
const TABS = [['era', '🏛', 'Era'], ['decidir', '⚖', 'Decidir'], ['destino', '🧭', 'Destino'], ['gente', '👥', 'Gente'], ['ciudad', '🏙', 'Ciudad'], ['cronica', '📜', 'Crónica']];
let tab = 'era', vista = null, subGente = 'vivos', ordenGente = 'fama', alVista = 0;
function irA(t, v = null) { tab = t; vista = v; if (!escritorio() && nivelHoja === 0) ponerHoja(1); pintar(true); $('#cuerpo').scrollTop = 0; }
$('#pestanas').addEventListener('click', (e) => { const b = e.target.closest('[data-tab]'); if (!b) return; if (tab === b.dataset.tab && !vista && !escritorio()) { ponerHoja(nivelHoja === 1 ? 2 : 1); return; } irA(b.dataset.tab); });

// ---------------------------------------------------------------- elegir y seguir gente
let selId = null, siguiendo = false;
function elegir(id) { selId = id; E.elegir(id); }
function seguir(id) { if (id == null || (siguiendo && selId === id)) { O.seguir(null); siguiendo = false; } else { elegir(id); siguiendo = true; O.seguir(() => (S.vivo(s, id) ? E.posDe(id) : null), 14); } pintar(true); }
O.alTocar((ev) => {
  const id = E.personaEn(ev); if (id != null) { elegir(id); irA('gente', { p: id }); return; }
  const c = E.celdaEn(ev); if (!c) return;
  const usos = S.USOS, viven = s.gente.filter((a) => a.hogar === c.k).length, trab = s.gente.filter((a) => a.trabajo === c.k).length;
  const t = c.u ? `${usos[c.u].n}${c.n > 1 ? ` · ${c.n} pisos` : ''} · estilo ${S.ERAS[c.e].n.toLowerCase()}${c.ru ? ' · EN RUINAS' : ''}` : c.o ? `En obra: ${usos[c.o.u].n} (${Math.round(c.o.p * 100)} %)` : { p: 'Pradera', b: 'Bosque', r: 'Roca', m: `Montaña (${c.h.toFixed(1)} m)`, a: 'Lago', v: 'Río', c: 'Cementerio' }[c.t];
  aviso(`${t}${viven ? ` · viven ${viven}` : ''}${trab ? ` · trabajan ${trab}` : ''}${c.cont > 0.15 ? ` · contaminación ${Math.round(c.cont * 100)} %` : ''}`);
});
document.addEventListener('click', (e) => {
  const t = e.target;
  const p = t.closest('[data-p]'); if (p) { elegir(+p.dataset.p); irA('gente', { p: +p.dataset.p }); return; }
  if (t.closest('[data-seguir]')) seguir(+t.closest('[data-seguir]').dataset.seguir);
  const pw = t.closest('[data-poder]'); if (pw) { const r = S.usarPoder(s, pw.dataset.poder, pw.dataset.arg ?? selId); aviso(r || `✨ ${S.PODERES[pw.dataset.poder].n}`); if (!r && pw.dataset.poder === 'forzar') { s.pausar = false; } pintar(true); }
  const sg = t.closest('[data-sub]'); if (sg) { subGente = sg.dataset.sub; pintar(true); }
  const od = t.closest('[data-orden]'); if (od) { ordenGente = od.dataset.orden; pintar(true); }
  const al = t.closest('[data-al]'); if (al) { alVista = +al.dataset.al; const C = s.ciudades[alVista]; seguir(null); O.volar(new THREE.Vector3(C.x, 2, C.z), alVista ? 50 : 80); pintar(true); }
  if (t.closest('[data-volver]')) { vista = null; pintar(true); }
  if (t.closest('[data-nueva]')) nuevaCivilizacion();
  if (t.closest('[data-seguirtiempo]')) { vel.elegir(3); aviso('El tiempo sigue.'); }
});

// ---------------------------------------------------------------- pintar
const fmt = (n) => (n >= 1e6 ? `${(n / 1e6).toLocaleString('es-CO', { maximumFractionDigits: 1 })} M` : n >= 1e4 ? `${Math.round(n / 1e3)} mil` : Math.round(n).toLocaleString('es-CO'));
const pct = (x) => `${Math.round(x * 100)} %`;
const barra = (t, v, max = 100, c = '#e7c46a', txt = null) => `<div class="bar"><span>${t}</span><u><i style="width:${Math.max(0, Math.min(100, (v / max) * 100))}%;--c:${c};background:${c}"></i></u><em>${txt ?? Math.round(v)}</em></div>`;
const nom = (a) => `<button class="lnk" data-p="${a.id}">${esc(a.nombre)}</button>`;
const EJES = [['cf', 'Ciencia', 'Fe', '#6aa8e0', '#c8a0f0', 'Lo que la gente piensa de la ciencia y la religión, más lo que decidió (academias, censura, teocracia…).'], ['aa', 'Ambición', 'Armonía', '#e07a5a', '#7cc36a', 'Ambición, guerra y conquista frente a empatía y paz.'], ['ic', 'Individuo', 'Colectivo', '#e0b84a', '#5ac8b8', 'Propiedad, mercado y codicia frente a igualdad y comunidad.'], ['ni', 'Industria', 'Naturaleza', '#8a8a8a', '#4fa84a', 'Fábricas, humo y tecnología frente a bosques, parques y ecología.']];
function pintar(forzar = false) {
  const f = S.fecha(s), Er = S.ERAS[Math.min(8, s.era)];
  $('#titulo').textContent = `${Er.i} ${s.destino ? S.DESTINOS[s.destino.tipo].n : Er.n} · ${S.fechaTxt(s)}`;
  $('#infl').textContent = Math.floor(s.esp.influencia);
  pintarSi($('#pestanas'), TABS.map(([k, e, n]) => `<button data-tab="${k}" class="${tab === k ? 'on' : ''}"><span>${e}</span>${n}${k === 'decidir' && s.decision ? '<i class="badge">!</i>' : ''}</button>`).join(''));
  const h = { era: htmlEra, decidir: htmlDecidir, destino: htmlDestino, gente: htmlGente, ciudad: htmlCiudad, cronica: htmlCronica }[tab]();
  if (forzar || !presionado) pintarSi($('#cuerpo'), h);
}
let presionado = false; $('#cuerpo').addEventListener('pointerdown', () => { presionado = true; }); addEventListener('pointerup', () => setTimeout(() => { presionado = false; }, 60));
function htmlFin() {

    <h3>Construcciones</h3><div class="chips">${Object.entries(usos).sort((a, x) => x[1] - a[1]).map(([k, n]) => `<span class="chip">${esc(S.USOS[k].n)}: ${n}</span>`).join('')}</div>
    <h3>Obras</h3>${obras.length ? obras.map((c) => barra(`${S.USOS[c.o.u].n}${c.u ? ' (renovación)' : ''}`, c.o.p * 100, 100, '#e0b84a', pct(c.o.p))).join('') : '<div class="nota">Nada en obra.</div>'}${C.falta ? `<div class="nota">Falta material para: ${esc(C.falta)}.</div>` : ''}
    <div class="nota" style="margin-top:8px">La ciudad crece hacia afuera mientras hay suelo, y hacia arriba cuando la era lo permite (máximo ${S.ERAS[Math.min(8, s.era)].pisos} pisos). Cuando cambia la era, los edificios viejos se renuevan con la arquitectura nueva.</div>`;
}
function htmlCronica() {
  const H = s.hist, c = s.cont, ult = (l) => (l.length ? l[l.length - 1] : 0);
  const g = (t, d, col, txt) => `<div><span>${t}<b>${txt ?? fmt(ult(d))}</b></span>${htmlGrafica([{ datos: d, color: col }], 54)}</div>`;
  const linea = S.ERAS.slice(0, 8).map((E0, i) => { const ya = s.eras.filter((x) => x.era === i).pop(); return `<div class="${i === s.era && !s.destino ? 'on' : ya ? 'ya' : ''}"><em>${E0.i}</em>${esc(E0.n.replace('Era ', '').replace('de la ', ''))}<br><small>${ya ? `año ${ya.anio}` : '—'}</small></div>`; }).join('') + (s.destino ? `<div class="on"><em>${S.DESTINOS[s.destino.tipo].i}</em>${esc(S.DESTINOS[s.destino.tipo].n)}<br><small>año ${s.destino.anio}</small></div>` : '');
  const hist = (s.historia || []).length ? `<h3>Historia del orbe</h3>${s.historia.slice().reverse().map((x) => `<div class="nota">${x.i} Ciclo ${x.ciclo}: ${esc(x.n)}${x.causa ? ` (${esc(S.CAUSAS[x.causa]?.n.toLowerCase() || x.causa)})` : ''} · ${x.anios} años · llegó a ${S.ERAS[Math.min(8, x.era)].n.toLowerCase()}</div>`).join('')}` : '';
  return htmlFin() + `<h3>Línea del tiempo</h3><div class="linea">${linea}</div>
    <div class="chips" style="margin:8px 0"><span class="chip">👶 ${c.nacimientos}</span><span class="chip">🕯 ${c.muertes}</span><span class="chip">💡 ${c.inventos} inventos</span><span class="chip">✊ ${c.revoluciones} revoluciones</span><span class="chip">⚔ ${c.guerras} guerras</span><span class="chip">🏙 ${c.ciudades} ciudades</span></div>
    <div class="grafs">${g('Ciudadanos', H.pob, '#e7c46a')}${g('Habitantes', H.hab, '#e0a050')}${g('Ciencia por año', H.ciencia, '#6aa8e0')}${g('Fe por año', H.fe, '#c8a0f0')}${g('Ánimo', H.animo, '#7cc36a')}${g('Ecología', H.eco, '#4fa84a')}</div>
    <h3>Hitos</h3><ul class="diario">${s.hitos.slice(0, 80).map((x) => `<li class="${x.tipo}"><span class="d">${esc(x.d)}</span>${esc(x.texto)}</li>`).join('')}</ul>${hist}`;
}

// ---------------------------------------------------------------- avisos, etiqueta y bucle
let visto = s.diario[0];
function avisosNuevos() {
  const nuevos = []; for (const x of s.diario) { if (x === visto) break; nuevos.push(x); } visto = s.diario[0];
  for (const x of nuevos.filter((x) => ['logro', 'malo', 'decision', 'era', 'espiritu'].includes(x.tipo)).slice(0, 2).reverse()) aviso(x.texto, 4200);
}
const etq = $('#etq');
function etiqueta() {
  const a = selId != null && S.vivo(s, selId), p = a && !E.estaDentro(selId) && E.posDe(selId);
  if (!p) { etq.style.display = 'none'; return; }
  const q = O.proyectar(p.add(new THREE.Vector3(0, 1.4, 0)));
  etq.style.display = q.visible ? '' : 'none'; etq.style.left = q.x + 'px'; etq.style.top = q.y + 'px'; etq.textContent = a.nombre;
}
let tUI = 0, tGuardar = 0, finVisto = s.fin;
O.cada((dt) => {
  if (mult && !(s.decision && pausaDecision && s.pausar)) { s.pausar = false; S.avanzar(s, dt * mult * MIN_POR_SEG, 40); }
  if (s.pausar && s.decision) { if (pausaDecision) { if (mult) { vel.elegir(0); irA('decidir'); aviso(`⚖ La sociedad debe decidir: ${s.decision.t}`, 5000); } } s.pausar = false; }
  if (s.fin && !finVisto) { finVisto = true; vel.elegir(0); irA('cronica'); }
  O.setHora(S.horaDe(s), { nublado: Math.min(0.85, (s.clima.lluvia ? 0.6 : 0) + s.contaminacion * 0.8) });
  E.actualizar(s, dt, mult);
  etiqueta();
  tUI += dt; if (tUI > 0.5) { tUI = 0; pintar(); avisosNuevos(); }
  tGuardar += dt; if (tGuardar > 20) { tGuardar = 0; guardar(); }
});
pintar(true); encuadre();
$('#loader').style.opacity = '0'; setTimeout(() => $('#loader').remove(), 700);
if (avisoInicial) aviso(avisoInicial, 6000);
</script>
