<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/" } }</script>
<script type="module">
import { crearOrbe, THREE } from './motor/orbe3d.js';
import { $, esc, barraVelocidades, botonCalidad, aviso, panel, pintarSi, htmlDiario, htmlGrafica, guardarJSON, cargarJSON } from './motor/ui.js';
import * as S from './civilizaciones/sim.js';

const CLAVE = 'orbe-civilizaciones', CLAVE_CFG = 'orbe-civilizaciones-config-v2';
const escritorio = () => innerWidth >= 900;
const O = crearOrbe($('#stage'), { radio: 46, colorSuelo: 0x1d4f7a, colorBase: 0x2a2018, camara: { pos: new THREE.Vector3(0, 78, 92), target: new THREE.Vector3(0, 0, 4) } });
const ESC = crearEscena(O, { etiquetas: $('#etiquetas') });
const fmt = (n) => (n >= 1e6 ? `${(n / 1e6).toLocaleString('es-CO', { maximumFractionDigits: n >= 1e7 ? 0 : 1 })} ${n >= 2e6 ? 'millones' : 'millón'}` : n >= 1e4 ? `${Math.round(n / 1e3)} mil` : Math.round(n).toLocaleString('es-CO'));
const pct = (x) => `${Math.round(x * 100)} %`;
const R_NOM = Object.fromEntries(S.RASGOS.map(([k, n, e]) => [k, `${e} ${n}`]));

// ---------------------------------------------------------------- estado de la página
let E = null, previa = null, mult = 0, acum = 0, frac = 0, tUI = 0, tGuardar = 0;
let tab = 'pueblos', vista = null;          // vista: null (lista) | { t: 'civ'|'ciudad', id }
let modoPoder = null, objetivo = null, catPoder = 'naturaleza';
let camGuerra = false, siguiendoComb = -1, lento = true;
let creando = false;
const menuP = panel($('#menu'));

// ---------------------------------------------------------------- la hoja: cerrada / media / abierta (arrastrable); en escritorio es un panel lateral
const hoja = $('#hoja'), ALTOS = () => [148 + (innerHeight < 640 ? -8 : 0), Math.round(innerHeight * 0.5), Math.round(innerHeight * 0.86)];
let nivelHoja = 1;
function ponerHoja(n, anim = true) {
  nivelHoja = Math.max(0, Math.min(2, n)); hoja.classList.toggle('arrastrando', !anim);
  hoja.style.setProperty('--h', `${ALTOS()[nivelHoja]}px`); setTimeout(encuadre, anim ? 300 : 0);
}
{ let y0 = null, h0 = 0;
  const asa = $('#asa');
  asa.addEventListener('pointerdown', (e) => { y0 = e.clientY; h0 = hoja.getBoundingClientRect().height; asa.setPointerCapture(e.pointerId); hoja.classList.add('arrastrando'); });
  asa.addEventListener('pointermove', (e) => { if (y0 == null) return; const h = Math.max(110, Math.min(innerHeight * 0.92, h0 + (y0 - e.clientY))); hoja.style.setProperty('--h', `${h}px`); });
  const soltar = (e) => { if (y0 == null) return; const dy = y0 - e.clientY, h = h0 + dy; y0 = null; hoja.classList.remove('arrastrando');
    if (Math.abs(dy) < 6) return ponerHoja(nivelHoja === 0 ? 1 : nivelHoja === 1 ? 2 : 0);
    const A = ALTOS(); let mejor = 0; A.forEach((a, i) => { if (Math.abs(a - h) < Math.abs(A[mejor] - h)) mejor = i; }); ponerHoja(mejor); };
  asa.addEventListener('pointerup', soltar); asa.addEventListener('pointercancel', soltar);
}
// el orbe se corre para que quede en el espacio libre (arriba de la hoja, o a la izquierda del panel)
function encuadre() {
  const W = innerWidth, H = innerHeight;
  if (escritorio()) O.camera.setViewOffset(W, H, 205, 0, W, H);
  else { const h = hoja.getBoundingClientRect().height; O.camera.setViewOffset(W, H, 0, Math.min(h * 0.5, H * 0.33), W, H); }
  O.camera.updateProjectionMatrix();
}
addEventListener('resize', () => { if (!escritorio()) ponerHoja(nivelHoja, false); encuadre(); });

// ---------------------------------------------------------------- controles: velocidades, cámara de guerra, más
const ctr = $('#controles');
const vel = barraVelocidades(ctr, [['⏸', 0], ['×1', 1], ['×10', 10], ['×50', 50]], 'civ-vel', 2, (m) => { mult = m; });
[...ctr.querySelectorAll('button')].forEach((b) => b.addEventListener('click', () => { velAntes = null; lentoHasta = 0; }));
ctr.append(Object.assign(document.createElement('div'), { className: 'sep' }));
const bGuerra = Object.assign(document.createElement('button'), { id: 'bGuerra', textContent: '🎥', title: 'Cámara de guerra: sigue la batalla más grande' }); bGuerra.onclick = () => alternarCamGuerra(); ctr.append(bGuerra);
const bMas = Object.assign(document.createElement('button'), { textContent: '⋯', title: 'Más' }); bMas.onclick = () => { pintarMenu(); menuP.alternar(); }; ctr.append(bMas);
function pintarMenu() {
  $('#menu').innerHTML = `<div class="cab"><b>Más</b><button data-cerrar>×</button></div><div class="ops">

      <div class="presu ${pasa ? 'pasa' : ''}" id="presu">${pasa ? `⚠️ Te pasas por ${gasto - PRESUPUESTO} puntos: al empezar se recorta lo más alto. <button class="boton" data-cv="ajustar" style="min-height:32px;padding:4px 10px">Ajustar ahora</button>` : `Puntos usados: ${gasto} de ${PRESUPUESTO}`}<u><i style="width:${Math.min(100, gasto / PRESUPUESTO * 100)}%"></i></u></div>
      ${GRUPOS.map((g) => `<div class="grupo"><b>${g}</b><div class="desl">${S.RASGOS.filter((r) => r[3] === g).map(([k, n, e, , d]) => `<label title="${esc(d)}"><span>${e} ${n}</span><b id="v_${k}">${c.r[k] ?? 50}</b><input type="range" min="0" max="100" value="${c.r[k] ?? 50}" data-k="${k}"></label>`).join('')}</div></div>`).join('')}
    </div>
    <p class="nota">Cada punto cuenta: subir un rasgo obliga a bajar otro. Cada pueblo nace donde mejor encaja su clima. Durante el aislamiento evolucionan solos; al caer el velo se descubren.</p>
    <div class="pie"><button class="boton" data-cv="todo">🎲 Todo al azar</button><button class="boton prim" data-cv="ir">▶ Empezar la historia</button></div>`;
  const cambio = (prev = true) => { guardarCfg(); if (prev) rehacerPrevia(); };
  $('#cSem').onchange = (e) => { cfg.semilla = Math.max(1, parseInt(e.target.value, 10) || 1); cambio(); };
  $('#cVelo').oninput = (e) => { cfg.velo = +e.target.value; $('#cVeloV').textContent = cfg.velo; };
  $('#cVelo').onchange = () => cambio();
  $('#cNom').oninput = (e) => { c.nombre = e.target.value || 'Sin nombre'; cambio(false); };
  $('#cNom').onchange = () => pintarCreador();
  $('#cCol').oninput = (e) => { c.color = e.target.value; cambio(false); }; $('#cCol').onchange = () => { pintarCreador(); rehacerPrevia(); };
  for (const inp of cuerpo.querySelectorAll('.desl input')) {
    inp.oninput = () => { c.r[inp.dataset.k] = +inp.value; $(`#v_${inp.dataset.k}`).textContent = inp.value; c.preset = null; const g = costo(c.r), p = $('#presu'); p.classList.toggle('pasa', g > PRESUPUESTO); p.firstChild.textContent = g > PRESUPUESTO ? `⚠️ Te pasas por ${g - PRESUPUESTO} puntos ` : `Puntos usados: ${g} de ${PRESUPUESTO}`; p.querySelector('u i').style.width = `${Math.min(100, g / PRESUPUESTO * 100)}%`; };
    inp.onchange = () => cambio();
  }
}
function clicCreador(e) {
  const q = (s) => e.target.closest(s); let b; const c = cfg.civs[pest];
  const listo = (prev = true) => { guardarCfg(); if (prev) rehacerPrevia(); const st = cuerpo.scrollTop; pintarCreador(); cuerpo.scrollTop = st; };
  if ((b = q('[data-tipo]'))) { cfg.tipo = b.dataset.tipo; return listo(); }
  if ((b = q('[data-num]'))) { const n = +b.dataset.num; while (cfg.civs.length < n) { const k = Object.keys(S.PRESETS).find((p) => !cfg.civs.some((x) => x.preset === p)) || 'horda'; cfg.civs.push(civDePreset(k)); } cfg.civs.length = n; pest = Math.min(pest, n - 1); return listo(); }
  if ((b = q('[data-pest]'))) { pest = +b.dataset.pest; return listo(false); }
  if ((b = q('[data-emb]'))) { c.emblema = b.dataset.emb; verDetalle.emblemas = false; return listo(false); }
  if ((b = q('[data-pre]'))) { cfg.civs[pest] = civDePreset(b.dataset.pre); return listo(); }
  if ((b = q('[data-esp]'))) { const k = b.dataset.esp; if (c.especiales.includes(k)) c.especiales = c.especiales.filter((x) => x !== k); else { if (c.especiales.length >= 2) c.especiales.shift(); c.especiales.push(k); } c.preset = null; return listo(); }
  if ((b = q('[data-doc]'))) { c.doctrina = b.dataset.doc; c.preset = null; return listo(); }
  if ((b = q('[data-est]'))) { c.estilo = b.dataset.est; return listo(); }
  if ((b = q('[data-cv]'))) {
    const a = b.dataset.cv;
    if (a === 'volver') return cerrarCreador();
    if (a === 'sem') { cfg.semilla = Math.floor(Math.random() * 99999) + 1; return listo(); }
    if (a === 'emb') { verDetalle.emblemas = !verDetalle.emblemas; return listo(false); }
    if (a === 'ale') { cfg.civs[pest] = aleatoria(pest); return listo(); }
    if (a === 'ajustar') { c.r = ajustarPresupuesto(c.r); return listo(); }
    if (a === 'todo') { cfg.semilla = Math.floor(Math.random() * 99999) + 1; cfg.tipo = ['continente', 'archipielago', 'pangea'][Math.floor(Math.random() * 3)]; cfg.velo = 100 + Math.floor(Math.random() * 15) * 50; const n = 3 + Math.floor(Math.random() * 4); cfg.civs = []; for (let i = 0; i < n; i++) cfg.civs.push(aleatoria(i)); pest = 0; return listo(); }
    if (a === 'ir') return empezar();
  }
}
function empezar() {
  guardarCfg(); E = S.crearMundo(cfg); vistoMom = E.efectos.reduce((m, f) => Math.max(m, f.id), -1); previa = null; acum = 0; creando = false; vista = null; tab = 'pueblos';
  ESC.montar(E); if (mult === 0) vel.elegir(2);
  guardar(); aviso(E.velo ? `Comienza la historia. El velo caerá en el año ${E.velo}.` : 'Comienza la historia.');
  if (!escritorio()) ponerHoja(1); O.volar(new THREE.Vector3(0, 0, 4), 120); pintarTodo(true);
}

// ---------------------------------------------------------------- guardado (con respaldo)
function guardar() { if (E) guardarJSON(CLAVE, S.exportar(E)); }
addEventListener('pagehide', guardar);
document.addEventListener('visibilitychange', () => { if (document.hidden) guardar(); });

// ---------------------------------------------------------------- momentos: cae el velo, primer contacto, batallas grandes
let vistoMom = -1, tMom = 0, lentoHasta = 0, velAntes = null;
function momento(html) { const el = $('#momento'); el.innerHTML = html; el.classList.add('ver'); clearTimeout(tMom); tMom = setTimeout(() => el.classList.remove('ver'), 5200); }
function respiro(seg) { if (vel.indice > 1) { velAntes = vel.indice; vel.elegir(1); } lentoHasta = performance.now() + seg * 1000; }
function momentos() {
  for (const f of E.efectos) {
    if (f.id <= vistoMom) continue; vistoMom = f.id;
    if (f.t === 'velo') { momento(`<div class="t1">🌫️ ¡El velo cae!</div><div class="t2">Tras ${E.velo} años de aislamiento, los pueblos pueden encontrarse</div>`); respiro(6); }
    else if (f.t === 'contacto') { const A = E.civs[f.a], B = E.civs[f.b]; if (!A || !B) continue; if (camGuerra) { aviso(`🤝 Primer contacto: ${A.emblema} ${A.nombre} y ${B.emblema} ${B.nombre}`); continue; } momento(`<div class="t1">🤝 ¡Primer contacto!</div><div class="t2"><span style="color:${A.color}">${A.emblema} ${esc(A.nombre)}</span> y <span style="color:${B.color}">${B.emblema} ${esc(B.nombre)}</span> · año ${f.año}</div>`); O.volar(ESC.posCelda(f.celda), 42); respiro(6); }
    else if (f.t === 'batalla' && camGuerra) { const cb = E.combates.find((c) => c.id === f.comb); if (!cb) continue; const grande = cb.f0[0] + cb.f0[1]; const actual = E.combates.find((c) => c.id === siguiendoComb); if (!actual || grande > (actual.f0[0] + actual.f0[1]) * 1.2) seguirComb(cb); if (lento && grande > 1500) respiro(8); }
    else if (f.t === 'caida' && camGuerra && f.arrasada) { const ci = E.ciudades.find((c) => c.celda === f.celda); aviso(`🔥 ¡${ci ? ci.nombre : 'Una ciudad'} es arrasada!`); }
  }
  if (lentoHasta && performance.now() > lentoHasta) { lentoHasta = 0; if (velAntes != null && vel.indice === 1) vel.elegir(velAntes); velAntes = null; }
}

// ---------------------------------------------------------------- bucle
O.cada((dt, t) => {
  const pausado = !E || creando || modoPoder;
  if (!pausado && mult > 0) {
    acum += dt * mult; let n = 0; const t0 = performance.now();
    while (acum >= 1 && n < 60) { S.paso(E); acum -= 1; n++; momentos(); if (E.fin && !E.finVisto && !E._finAvisado) { E._finAvisado = true; acum = 0; vel.elegir(0); tab = 'pueblos'; vista = null; if (!escritorio()) ponerHoja(1); pintarTodo(true); break; } if (performance.now() - t0 > 22) { acum = Math.min(acum, 1); break; } }
    frac = Math.min(0.999, acum);
  } else if (E && !creando) momentos();
  const est = creando ? previa || E : E || previa;
  if (est) ESC.actualizar(est, est === E ? frac : 0, dt, t);
  O.setHora(ESC.eclipse > 0 ? 23 : 12.5 + 8.5 * Math.sin((t / 180) * Math.PI * 2));
  tUI += dt; if (tUI > 0.35) { tUI = 0; if (!creando) pintarTodo(); else pintarArriba(); vigilarGuerra(); }
  tGuardar += dt; if (tGuardar > 15) { tGuardar = 0; guardar(); }
});

// ---------------------------------------------------------------- arranque (las partidas de la versión anterior se migran)
const crudo = cargarJSON(CLAVE);
if (crudo && crudo.poderes && crudo.poderes.energia == null) crudo.v = 1;   // la versión anterior tenía «cargas»: se convierte
let cargado = null; try { cargado = S.importar(crudo); } catch (e) { console.warn('[civilizaciones] no se pudo cargar la partida', e); }
if (cargado) { E = cargado; vistoMom = E.efectos.reduce((m, f) => Math.max(m, f.id), -1); ESC.montar(E); }
else { previa = S.crearMundo(cfg); ESC.montar(previa); creando = true; }
ponerHoja(escritorio() ? 1 : creando ? 2 : 1, false);
if (creando) pintarCreador();
pintarTodo(true); encuadre();
setTimeout(() => { $('#loader').style.opacity = '0'; setTimeout(() => $('#loader').remove(), 600); }, 300);
window.civ = { get E() { return E; }, S, ESC, O };
</script>
